  - slug: computer-vision
    title: কম্পিউটার ভিশন
    status: বর্তমান ফোকাস
    image: /images/papers/attentive-yolo-architecture.jpg
    image_alt: Attentive-YOLO এর আর্কিটেকচার ডায়াগ্রাম, মনোযোগ ব্লকের মাধ্যমে ইনপুট ইমেজ থেকে সনাক্তকরণ আউটপুট পর্যন্ত
    summary: লাইটওয়েট ডিপ লার্নিং যা রিয়েল-টাইমে, ছোট ডিভাইসে, বাস্তব-বিশ্বের পরিস্থিতিতে জিনিস সনাক্ত করে এবং পরিমাপ করে।
    intro: >-
      আমি এমন কম্পিউটার ভিশন সিস্টেম তৈরি করি যা ডেটা যেখানে কাজ করে: একটি পাইপে রাস্পবেরি পাইতে, রাস্তার উপর একটি
      ড্রোনে বা একটি বাগানে কৃষকের ফোনে৷ এর মানে এমন মডেল যা সঠিক কিন্তু ছোট, এবং ল্যাবের বাইরে পরীক্ষিত।


      [আইওটি ভিশন ল্যাব, আইআইটি কানপুর](https://pbagade0.wixsite.com/priyanka/about)-এ, আমি
      [মনোযোগী-YOLO](/blog/visapp-2024-attentive-yolo) তৈরি করেছি, যা YOLOv7-tiny-এর তুলনায় প্রায় 20% কম প্যারামিটার
      সহ জল-পাইপের ত্রুটি খুঁজে পায়। অন্যান্য কাজের মধ্যে রয়েছে সাইট্রাস পোকা ধরার জন্য [ড্রোন যা গাড়ির গতি পরিমাপ
      করে](/blog/uav-speed-detector-2023) এবং [Dr_OrangeApp](/blog/dr-orangeapp-2024)। এই কাজটি এখন [দৃষ্টি-ভাষা
      মডেল](/research/vision-language-models) এর দিকে নিয়ে যায়।

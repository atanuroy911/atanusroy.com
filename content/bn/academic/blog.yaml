    cover_image: /images/papers/agv-ir-simulation.jpg
    summary: >-
      স্বয়ংক্রিয় নির্দেশিত যানবাহনের জন্য পাথ ট্র্যাকিং এবং ট্রাফিক ব্যবস্থাপনার বিষয়ে এ. দাসের সাথে আমাদের
      গবেষণাপত্র জার্নাল অফ রোবোটিক্স রিসার্চে প্রকাশিত হয়েছে।
    content: |-
      ## কেন এটা গুরুত্বপূর্ণ

      যখন অনেক AGV একই পথ ভাগ করে, যেমন ডেলিভারি রোবট ক্রমবর্ধমানভাবে করে,
      সংঘর্ষ বা গ্রিডলক ছাড়া তাদের চলন্ত রাখা কঠিন হয়ে যায়।

      ## পন্থা

      উ: দাস এবং আমি বিদ্যমান কৌশলগুলি পর্যালোচনা করেছি, তারপর একটি সিস্টেম সিমুলেট করেছি
      যানবাহনগুলিকে সমন্বয় করতে **টাইমড অটোমেটা** এর সাথে **IR সেন্সর**কে একত্রিত করে
      ভাগ করা পাথ এবং অপেক্ষার সময় কাটা।

      ## ফলাফল

      CoppeliaSim (V-REP) উচ্চ-জড়তা পরিস্থিতির সিমুলেশনে:

      - AGV স্বাভাবিক থেকে মাঝারি গতিতে রাখা হয়েছে (5 থেকে 7 ইউনিট)
      - সর্বাধিক যানজট **20%** কমেছে
      - ট্র্যাফিক মোট অবরোধ ছাড়া প্রবাহিত রাখা

      ![CoppeliaSim-এ একটি চিত্র-আট ট্র্যাক অনুসরণ করে সিমুলেটেড AGV](/images/papers/agv-ir-simulation.jpg)

      *এজিভিগুলি কপেলিয়া সিম সিমুলেশনে একটি চিত্র-আট ট্র্যাক ভাগ করছে৷ থেকে চিত্র
      রায় ও দাস (2024)।*

      *জার্নাল অফ রোবোটিক্স রিসার্চ* (2024) এ প্রকাশিত।

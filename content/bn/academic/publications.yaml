  - title: "পর্যালোচনা করুন: সার্ভিস রোবট গাণিতিক মডেল"
    year: 2022
    type: journal
    venue: EAI Trans. AI & Robotics
    venue_full: EAI AI এবং Robotics 1(1), 1-19-এ লেনদেন অনুমোদন করেছে
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - S. K. Sambo
      - Y. Zhong
      - L. Liao
    image: /images/papers/service-robot-types.jpg
    image_alt: চাকাযুক্ত এবং পায়ের রোবট থেকে ক্রলার এবং স্নেক রোবট পর্যন্ত পরিষেবা রোবটের প্রকারের চিত্র
    tldr: >-
      মডেলিং পরিষেবা রোবটগুলির জন্য একটি সূচনা পয়েন্ট: তাদের আকার এবং ব্যবহার এবং ডিফারেনশিয়াল-ড্রাইভ রোবটের গতিশীল
      মডেল।
    abstract: >-
      প্রায় 30 বছরের উন্নয়নের পর, পরিষেবা রোবটগুলি যন্ত্রপাতি, তথ্য, উপকরণ, নিয়ন্ত্রণ এবং ওষুধ জুড়ে অগ্রসর হয়েছে।
      তারা অনেক আকার ধারণ করে, প্রায়শই তাদের প্রয়োগ দ্বারা চালিত হয় এবং তাদের বিশ্লেষণের জন্য তাদের গঠন এবং আচরণ
      নিয়ন্ত্রণের গাণিতিক মডেলের প্রয়োজন হয়। এই কাগজটি উপলব্ধ পরিষেবা রোবটগুলির আকার এবং অ্যাপ্লিকেশনগুলি পর্যালোচনা
      করে এবং রোবট গতিবিদ্যা, রোবটের প্রকার এবং ডিফারেনশিয়াল-ড্রাইভ পরিষেবা রোবটের গতিশীল মডেলগুলির অগ্রগতির সংক্ষিপ্ত
      বিবরণ দেয়৷ এটি গবেষকদের জন্য একটি সূচনা পয়েন্ট হিসাবে বোঝানো হয়েছে, আরও ভাল সিমুলেশন এবং বিশ্লেষণকে সমর্থন করার
      জন্য।

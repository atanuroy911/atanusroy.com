      [রাস্পবেরি পাই SCADA সিস্টেম](/blog/raspberry-pi-scada-2019) খামারের জন্য, এবং একটি [কম খরচে হার্ট রেট
      মনিটর](/blog/iot-heart-rate-monitor-2022)।

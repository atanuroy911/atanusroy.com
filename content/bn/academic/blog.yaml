    title: পরিষেবা রোবট গাণিতিক মডেলের একটি পর্যালোচনা
    date: "2022-02-23"
    category: publication
    tags:
      - robotics
      - service-robots
      - kinematics
      - review
    cover_image: /images/papers/service-robot-types.jpg
    summary: >-
      AI এবং Robotics-এ EAI অনুমোদনকৃত লেনদেন-এ আমাদের ওপেন-অ্যাক্সেস পর্যালোচনা পরিষেবা রোবটের আকার, ব্যবহার এবং গতিশীল
      মডেলগুলিকে ম্যাপ করে, যে কেউ সেগুলিকে অনুকরণ করে তাদের জন্য একটি সূচনা পয়েন্ট হিসাবে।
    content: |-
      ## কেন একটি পর্যালোচনা

      পরিষেবা রোবট অনেক আকারে আসে, প্রতিটি তার কাজের দ্বারা চালিত হয়। একটি অনুকরণ করতে
      এবং এর নিয়ামক ডিজাইন করুন, আপনার প্রথমে এটির একটি গাণিতিক মডেল প্রয়োজন।

      ## এটা কি কভার করে

      আতা জাহাঙ্গীর মোশায়েদী এবং সহকর্মীদের সাথে, আমি পর্যালোচনা করেছি:

      - পরিষেবা রোবটের প্রধান প্রকার এবং অ্যাপ্লিকেশন
      - রোবট গতিবিদ্যা এবং ডিফারেনশিয়াল-ড্রাইভ রোবটের গতিশীল মডেল
      - আপনার কোন মডেলটি ব্যবহার করা উচিত অ্যাপ্লিকেশনটি কীভাবে আকার দেয়

      ![রিভিউতে কভার করা পরিষেবা রোবটের প্রকার](/images/papers/service-robot-types.jpg)

      *রিভিউতে কভার করা পরিষেবা রোবটের প্রকার। মোশায়েদী এট আল থেকে চিত্র।

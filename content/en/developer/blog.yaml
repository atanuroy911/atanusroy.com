  - id: joined-backend-ace
    title: "Joined Backend Ace as Software & DevOps Engineer"
    date: "2024-11-01"
    category: career
    tags: [career, devops, aws, laravel]
    cover_image: ""
    summary: >
      Started as Software & DevOps Engineer at Backend Ace (NY, USA) — full-stack work
      on Laravel/Next.js products and infrastructure migrations for real clients.
    content: |
      ## New Role

      I joined **Backend Ace**, a NY-based dev shop, as a Software & DevOps Engineer in
      November 2024. The work spans backend (PHP/Laravel), frontend (Next.js/React), and
      infrastructure — a mix that suits how I like to work.

      ## What I've Shipped So Far

      - Migrated a client's server and DNS from **DigitalOcean to AWS**, moving deployment
        onto Docker + Jenkins on EC2 instances
      - Imported and cleaned **14,536 restaurant records** (with photos and reviews pulled
        from Google Maps) for a client product, deduplicated and reformatted in Python
      - Built backend and frontend changes to support the new data — Laravel on the backend,
        Next.js on the frontend
      - Delivered a full-stack medical website for a healthcare client (The Bronx Clinic, NY)

      More on each of these as they ship publicly.
    github: ""
    link: ""
    pinned: true

  - id: digitalocean-to-aws-migration
    title: "Migrating Production Off DigitalOcean, Onto AWS"
    date: "2025-01-20"
    category: deployment
    tags: [aws, docker, jenkins, devops, migration]
    cover_image: ""
    summary: >
      Notes from moving a live client server and DNS from DigitalOcean to AWS EC2,
      with Docker and Jenkins handling deployment end to end.
    content: |
      ## Why Migrate

      The client's DigitalOcean droplet had grown past what a single-box setup could
      comfortably handle — no real CI/CD, manual deploys, and DNS management that made
      every change risky.

      ## The Move

      - Re-platformed onto **AWS EC2**, containerizing the app with **Docker** so the
        environment is reproducible
      - Set up **Jenkins** pipelines for build → test → deploy, replacing manual SSH-and-pray
        deployments
      - Migrated DNS carefully with low TTLs beforehand to keep the cutover close to zero
        downtime

      ## Takeaway

      Most of the actual risk in a migration like this isn't the compute — it's DNS and
      state (databases, uploaded files). Get those right first, and the rest is just
      following a checklist.
    github: ""
    link: ""
    pinned: false

  - id: iitk-fortinet-authenticator
    title: "Killing Campus Wi-Fi Timeouts with a PyQt5 Tray App"
    date: "2023-09-05"
    category: tools
    tags: [automation, network, python, pyqt5, tools]
    cover_image: ""
    summary: >
      IIT Kanpur's Fortinet captive portal logs you out every few hours. I built a
      PyQt5 GUI wrapper that silently re-authenticates in the background.
    content: |
      ## The Problem

      IIT Kanpur's Fortinet captive portal logs you out periodically — inconvenient any
      time, actively damaging when it kills a long-running training job or a remote SSH
      session.

      ## The Fix

      I built a small **PyQt5** GUI wrapper that:

      1. Watches connectivity in the background
      2. Automatically re-submits the auth form with keep-alive polling when the session drops
      3. Runs quietly, designed to survive on embedded devices left running unattended

      It's a small tool, but it's the kind of thing that pays for itself the first time it
      saves a job you'd otherwise have restarted from scratch.
    github: "https://github.com/atanuroy911/iitk-fortinet-gui"
    link: ""
    pinned: false

  - id: btc-core-webapp-launch
    title: "Building a Bitcoin RPC Browser with Java"
    date: "2025-03-10"
    category: project
    tags: [bitcoin, java, rpc, web-app]
    cover_image: ""
    summary: >
      A full web interface to interact with a Bitcoin Core node via JSON-RPC — real-time
      block data, wallet management, and transaction broadcasting.
    content: |
      ## The itch

      Running a Bitcoin Core full node means dropping into `bitcoin-cli` for anything —
      checking mempool stats, listing UTXOs, decoding a raw transaction. I wanted a clean
      browser UI instead, so I built one.

      ## Tech Stack

      - **Backend**: Java, wrapping the JSON-RPC calls
      - **Frontend**: React
      - **Auth**: HTTP Basic Auth (same credentials as `bitcoin.conf`)

      ## What I Learned

      - Bitcoin Core's RPC surface is *huge* — stick to what you need
      - `getblocktemplate` is expensive; don't call it frequently
      - Polling for mempool updates needs backoff, or you'll hammer the node

      Source is on GitHub — PRs and issues welcome.
    github: "https://github.com/atanuroy911/BTC-CORE-WEBAPP"
    link: ""
    pinned: false


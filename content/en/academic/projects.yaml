    paper_link: ""
    github_link: ""
    demo_link: ""
    blog_link: ""
  - title: "Automated Guided Vehicle (AGV) Path Tracking"
    year: 2022
    tags: ["Robotics", "AGV", "Simulation", "Path Planning"]
    venue: "Independent Research"
    description: "A simulated 4-wheel differential drive AGV in CoppeliaSim (V-REP) with a real-time, sensor-driven path tracking algorithm."
    abstract: >
      This project designs and simulates a 4-wheel differential drive AGV in CoppeliaSim
      (V-REP), then develops a robust path tracking algorithm that leverages real-time sensor
      data to keep the vehicle on its planned trajectory under simulated disturbances.

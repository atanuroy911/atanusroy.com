research_statements:
  - title: অটোনোমাস গাইডেড ভেহিকেল (AGV)
    description: >-
      বিটল অ্যান্টেনা অনুসন্ধানের মতো বিবর্তনীয় পদ্ধতি ব্যবহার করে অজানা পরিবেশে সর্বমুখী AGV-এর জন্য শক্তি-সচেতন এবং
      শক্তিশালী পথ পরিকল্পনা অ্যালগরিদম তৈরি করা।
  - title: কম্পিউটার ভিশন এবং এজ এআই
    description: >-
      এজ ডিভাইসে রিয়েল-টাইম ইনফরেন্সের জন্য লাইটওয়েট ডিপ লার্নিং আর্কিটেকচার (যেমন, অ্যাটেনটিভ-ইওলো) ডিজাইন করা, বিশেষ
      করে পাইপলাইনের ত্রুটি সনাক্তকরণ এবং কৃষি পর্যবেক্ষণের জন্য।
  - title: আইওটি এবং স্মার্ট পরিকাঠামো
    description: >-
      স্মার্ট পার্কিং এবং বুদ্ধিমান রাস্তার আলোর মতো শহুরে চ্যালেঞ্জের জন্য LoRaWAN এবং প্রান্ত কম্পিউটিং ব্যবহার করে
      মাপযোগ্য, কম-পাওয়ার সমাধান তৈরি করা।

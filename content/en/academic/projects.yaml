academic_projects:
  - title: "Autonomous Robot Navigation System"
    year: 2025
    tags: ["Computer Vision", "SLAM", "Robotics"]
    venue: "RARL, JXUST"
    description: "Vision-based autonomous navigation pipeline for an indoor mobile robot using depth sensors and a custom SLAM implementation to map dynamic environments in real-time."
    abstract: >
      We developed a vision-based autonomous navigation pipeline for an indoor mobile robot operating in dynamic warehouse environments. The system utilizes depth sensors (Intel RealSense D435) and a custom lightweight SLAM implementation that maps the environment in real-time using occupancy grid representations.

      A key challenge was extreme sensor noise and tight compute constraints (NVIDIA Jetson Nano). We tackled this by using a lightweight EfficientDet-based neural network for obstacle detection alongside a traditional probabilistic roadmap (PRM) planner. The hybrid approach reduces average path planning time by 38% compared to pure learning-based methods.

      The robot achieved a 94.2% task completion rate across 200 unseen indoor layouts, with an average replanning latency of under 120ms.

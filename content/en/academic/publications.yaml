  - title: "Dr_OrangeApp: Revolutionizing Real-Time Pest Detection in Citrus Orchards"
    year: 2024
    type: conference
    venue: ACM APAIBDF 2024
    venue_full: Proceedings of the 4th Asia-Pacific Artificial Intelligence and Big Data Forum, ACM
    authors: [A. J. Moshayedi, M. J. Jawadi, A. S. Roy, E. Rostami, Z. Wang, L. Yang, Q. Xu]
    tldr: >-
      A phone app that recognises five orange pests from a photo, with precision 1.00
      and F1 0.856 on 313 images, and found Citrus Leafminer on 10 trees in a real
      orchard.
    abstract: >-
      Orange pests threaten citrus crops, reducing yield and quality. This paper
      presents Dr_Orange, an app for real-time monitoring of pest infestations so
      farmers can act sooner, use less pesticide and improve productivity. Built
      with a personal image classifier, it adds charts, reports and QR codes to help
      farmers track pests and treatment. Tested on 313 images of five pests, it
      reached average accuracy and recall of 0.75, precision of 1.00 and an F1 score
      of 0.856. In an orange orchard it identified and reported Citrus Leafminer on
      10 trees. Lighting, photo angle and data quality can affect accuracy, and
      taking several photos helps.
    doi: 10.1145/3718491.3718618
    open_access: true
    post: dr-orangeapp-2024

  - title: Advanced Path Tracking and Traffic Management Using IR Sensors and Timed Automata
    year: 2024
    type: journal
    venue: J. Robotics Research
    venue_full: Journal of Robotics Research (JRR) 1(1)
    authors: [A. S. Roy, A. Das]
    image: /images/papers/agv-ir-sensor.jpg
    image_alt: Simulated AGV with its IR sensor and line sensor labelled
    tldr: >-
      IR sensors plus timed automata coordinate AGVs that share the same
      intersections. In simulation, peak congestion drops by 20% and traffic never
      fully blocks.
    abstract: >-
      Path tracking for Automated Guided Vehicles (AGVs) is a critical challenge,
      particularly where multiple AGVs share the same pathways. It matters even more
      in traffic management, where efficient coordination is essential to prevent
      congestion and ensure safety. As automation grows, for example with automated
      delivery robots, robust path tracking becomes more important. This paper
      reviews existing strategies, then simulates how integrating timed automata and
      sensors can minimize waiting times, reduce congestion and improve traffic
      efficiency. Simulation results in CoppeliaSim (V-REP) show AGVs keeping normal
      to moderate speeds (5 to 7 units) in high-congestion scenarios, reducing
      maximum congestion by 20% and preventing total blockage.
    figures:
      - src: /images/papers/agv-ir-simulation.jpg
        alt: Several AGVs following a figure-eight track in the CoppeliaSim simulator
        caption: AGVs sharing a figure-eight track in CoppeliaSim. Figure from the paper.
    doi: 10.64820/aepjrr.11.15.23.122024
    open_access: true
    post: agv-ir-timed-automata-2024

  - title: "A Novel IoT-Enabled Portable, Secure Automatic Self-Lecture Attendance System: Design, Development and Comparison"
    year: 2024
    type: journal
    venue: IJESDF
    venue_full: International Journal of Electronic Security and Digital Forensics 16(6), Inderscience
    authors: [A. J. Moshayedi, A. S. Roy, H. Ghorbani, H. Lotfi, X. Zhang, L. Liao, M. Gheisari]
    tldr: >-
      Students mark their own attendance with a phone and a QR code on a small IoT
      device, cheaply and with security and privacy built in. Tested in a live
      lecture.
    abstract: >-
      Monitoring student attendance matters, but existing tracking methods are
      costly, slow or inaccurate, and often overlook security and privacy. This paper
      presents SLAS, a novel IoT-based self-lecture attendance system that uses
      smartphones and QR codes. It addresses security and privacy while keeping
      attendance tracking simple, and it is compact, affordable, scalable and
      flexible for teachers and students. Tests in a live lecture showed the system
      is effective and accurate.
    doi: 10.1504/IJESDF.2024.142009
    post: iot-self-lecture-attendance-2024

  - title: "Attentive-YOLO: On-Site Water Pipeline Inspection Using Efficient Channel Attention and Reduced ELAN-Based YOLOv7"
    year: 2024
    type: conference
    venue: VISAPP 2024
    venue_full: Proceedings of the 19th International Joint Conference on Computer Vision, Imaging and Computer Graphics Theory and Applications (VISIGRAPP 2024), Vol. 4 VISAPP, 492–499
    authors: [A. S. Roy, P. Bagade]
    image: /images/papers/attentive-yolo-architecture.jpg
    image_alt: Architecture diagram of Attentive-YOLO, from input image through ECAM attention and R-ELAN blocks to detection output
    tldr: >-
      A lighter YOLOv7 with channel attention finds water-pipe defects on a
      Raspberry Pi: mAP 0.962 versus 0.93 for YOLOv7-tiny, with about 20% fewer
      parameters.
    abstract: >-
      Delivering clean water depends on timely inspection and repair of water pipes.
      Traditional inspection needs expensive manual work and experts on site, and
      real-time automatic detection is lacking. Current approaches such as YOLOv5
      with Retinex-based illumination perform acceptably but are too bulky for fast
      inference on edge devices. This paper proposes Attentive-YOLO, based on YOLOv7
      with a reduced Efficient Layer Aggregation Network (ELAN) and a lightweight
      attention module in the head and backbone, improving accuracy while cutting
      model size. It is designed for edge devices such as the Raspberry Pi, for IoT
      systems and pipeline inspection robots. Attentive-YOLO achieves an mAP of
      0.962, compared with 0.93 for YOLOv7-tiny at one-third channel width, with
      almost 20% fewer parameters.
    figures:
      - src: /images/papers/attentive-yolo-architecture.jpg
        alt: Architecture diagram of Attentive-YOLO, from input image through ECAM attention and R-ELAN blocks to detection output
        caption: Architecture of Attentive-YOLO. Figure from the paper, CC BY-NC-ND 4.0.
      - src: /images/papers/attentive-yolo-hardware.jpg
        alt: A Raspberry Pi with a camera, and two pipe images with detected defects boxed
        caption: (A) Edge hardware. (B) Defects detected on site. Figure from the paper, CC BY-NC-ND 4.0.
    doi: 10.5220/0012374000003660
    open_access: true
    post: visapp-2024-attentive-yolo

  - title: "Design and Development of FOODIEBOT Robot: From Simulation to Design"
    year: 2024
    type: journal
    venue: IEEE Access
    venue_full: IEEE Access 12, 36148–36172
    authors: [A. J. Moshayedi, A. S. Roy, L. Liao, A. S. Khan, A. Kolahdooz, A. Eftekhari]
    tldr: >-
      A food-serving robot whose PID controller was tuned in simulation with four
      optimizers (BAS, PSO, POA, EO). BAS was fastest, and real runs matched the
      simulation.
    abstract: >-
      This work covers the design and development of FOODIEBOT, an adaptive service
      robot that uses image processing, a mobile app and a web interface to handle
      objects in dining halls. Calibrating its PID controller was essential, so the
      model was simulated in MATLAB and tested on circular, elliptical, spiral and
      octagonal paths using four optimization methods: BAS, PSO, POA and EO. BAS was
      the most efficient, with the shortest execution times on every path and the
      best accuracy on one path; EO and POA were most accurate on others, and PSO
      reached the highest speeds on three paths. Simulated and real-world
      performance matched closely, confirming that simulation can reliably derive the
      robot's PID values.
    doi: 10.1109/ACCESS.2024.3355278
    open_access: true
    post: foodiebot-ieee-access-2024

  - title: A Secure Traffic Police Remote Sensing Approach via a Deep Learning-Based Low-Altitude Vehicle Speed Detector through UAVs in Smart Cities
    year: 2023
    type: journal
    venue: Future Transportation
    venue_full: Future Transportation 3(1), 189–209, MDPI
    authors: [A. J. Moshayedi, A. S. Roy, A. Taravet, L. Liao, J. Wu, M. Gheisari]
    image: /images/papers/uav-speed-fov.jpg
    image_alt: Diagram of a drone watching a car pass four timestamp points on a road
    tldr: >-
      A drone with a Raspberry Pi and MobileNet-SSD measures vehicle speeds in real
      time at a real intersection, flying 0.7 to 3 m high, with no officer on site.
    abstract: >-
      Unmanned aerial vehicles (UAVs) are widely used in transportation, for example
      for real-time vehicle speed detection in IoT-based smart cities. Most existing
      speed estimation methods lack real-time detection across different scenarios.
      This paper introduces a low-altitude vehicle speed detector using UAVs. We
      found the best Raspberry Pi camera field of view indoors and outdoors by
      changing its height and angle, embedded a MobileNet-SSD deep learning model on
      a Raspberry Pi 4B with an Intel Neural Compute Stick 2, and tested it at a
      JXUST university intersection with the UAV between 0.7 and 3 m. The result is
      an intelligent speed-control system that works without police present.
    figures:
      - src: /images/papers/uav-speed-fov.jpg
        alt: Diagram of a drone watching a car pass four timestamp points over 14.94 m
        caption: The real-vehicle test setup. Figure from the paper, CC BY 4.0.
    doi: 10.3390/futuretransp3010012
    open_access: true
    post: uav-speed-detector-2023

  - title: Deep Learning Application Pros and Cons Over Algorithm
    year: 2022
    type: journal
    venue: EAI Trans. AI & Robotics
    venue_full: EAI Endorsed Transactions on AI and Robotics 1(1), 1–13
    authors: [A. J. Moshayedi, A. S. Roy, A. Kolahdooz, Y. Shuxin]
    image: /images/papers/deep-learning-applications.jpg
    image_alt: Mind map of deep learning application areas and the models used in each
    tldr: >-
      A practical review of where deep learning beats traditional algorithms, from
      speech and vision to chatbots and healthcare. My most-cited paper.
    abstract: >-
      Deep learning is a new area of machine learning research that applies
      nonlinear, layered transformations to large datasets, and it has contributed
      greatly to artificial intelligence. This article reviews the contributions and
      new applications of deep learning, summarizing applications and algorithms for
      scholars. It introduces the advantages of deep learning's hierarchical,
      nonlinear approach and compares it with traditional algorithms in common
      applications such as voice recognition, chatbots, search and vision, as well
      as natural language processing, information retrieval and multimodal
      processing. It gives researchers and students a general overview of deep
      learning and its growing benefits.
    figures:
      - src: /images/papers/deep-learning-applications.jpg
        alt: Mind map of deep learning application areas and the models used in each
        caption: Deep learning application areas and common models. Figure from the paper, CC BY 3.0.
    doi: 10.4108/airo.v1i.19
    open_access: true
    post: deep-learning-pros-cons-2022

  - title: "Review on: The Service Robot Mathematical Model"
    year: 2022
    type: journal
    venue: EAI Trans. AI & Robotics
    venue_full: EAI Endorsed Transactions on AI and Robotics 1(1), 1–19
    authors: [A. J. Moshayedi, A. S. Roy, S. K. Sambo, Y. Zhong, L. Liao]
    image: /images/papers/service-robot-types.jpg
    image_alt: Diagram of service robot types, from wheeled and legged robots to crawler and snake robots
    tldr: >-
      A starting point for modelling service robots: their shapes and uses, and the
      dynamic models of differential-drive robots.
    abstract: >-
      After nearly 30 years of development, service robots have advanced across
      machinery, information, materials, control and medicine. They take many
      shapes, often driven by their application, and analysing them requires
      mathematical models of their structure and behaviour under control. This
      paper reviews the shapes and applications of available service robots and
      summarizes progress on robot dynamics, robot types and the dynamic models of
      differential-drive service robots. It is meant as a starting point for
      researchers, to support better simulation and analysis.
    figures:
      - src: /images/papers/service-robot-types.jpg
        alt: Diagram of service robot types, from wheeled and legged robots to crawler and snake robots
        caption: Types of service robots covered in the review. Figure from the paper, CC BY 3.0.
    doi: 10.4108/airo.v1i.20
    open_access: true
    post: service-robot-model-review-2022


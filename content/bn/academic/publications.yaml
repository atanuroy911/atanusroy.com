  - title: আইআর সেন্সর এবং টাইমড অটোমেটা ব্যবহার করে উন্নত পাথ ট্র্যাকিং এবং ট্রাফিক ব্যবস্থাপনা
    year: 2024
    type: journal
    venue: J. Robotics Research
    venue_full: জার্নাল অফ রোবোটিক্স রিসার্চ (JRR) 1(1)
    authors:
      - A. S. Roy
      - A. Das
    image: /images/papers/agv-ir-sensor.jpg
    image_alt: সিমুলেটেড AGV এর IR সেন্সর এবং লাইন সেন্সর লেবেলযুক্ত
    tldr: >-
      IR সেন্সর প্লাস টাইমড অটোমেটা কোঅর্ডিনেট এজিভি যা একই ছেদ ভাগ করে। সিমুলেশনে, পিক কনজেশন 20% কমে যায় এবং ট্রাফিক
      কখনই পুরোপুরি বন্ধ হয় না।
    abstract: >-
      অটোমেটেড গাইডেড ভেহিকেল (AGVs) এর জন্য পাথ ট্র্যাকিং একটি গুরুত্বপূর্ণ চ্যালেঞ্জ, বিশেষ করে যেখানে একাধিক AGV একই
      পাথওয়ে শেয়ার করে। এটি ট্রাফিক ব্যবস্থাপনায় আরও বেশি গুরুত্বপূর্ণ, যেখানে যানজট রোধ করতে এবং নিরাপত্তা নিশ্চিত
      করতে দক্ষ সমন্বয় অপরিহার্য। স্বয়ংক্রিয়তা বৃদ্ধির সাথে সাথে, উদাহরণস্বরূপ স্বয়ংক্রিয় ডেলিভারি রোবটের সাথে,
      শক্তিশালী পথ ট্র্যাকিং আরও গুরুত্বপূর্ণ হয়ে ওঠে। এই কাগজটি বিদ্যমান কৌশলগুলি পর্যালোচনা করে, তারপরে অনুকরণ করে যে
      কীভাবে টাইমড অটোমেটা এবং সেন্সরগুলিকে একীভূত করা অপেক্ষার সময়গুলিকে কমিয়ে আনতে পারে, যানজট কমাতে পারে এবং
      ট্র্যাফিক দক্ষতা উন্নত করতে পারে৷ CoppeliaSim (V-REP) এর সিমুলেশন ফলাফলগুলি দেখায় যে AGVগুলি উচ্চ-জড়িত
      পরিস্থিতিতে স্বাভাবিক থেকে মাঝারি গতিতে (5 থেকে 7 ইউনিট) রাখে, সর্বাধিক যানজট 20% হ্রাস করে এবং মোট অবরোধ প্রতিরোধ
      করে।

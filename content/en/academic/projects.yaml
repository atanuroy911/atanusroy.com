academic_projects:
  - title: "Bengali Song Visualization"
    year: 2024
    tags: ["NLP", "Stylometry", "Data Visualization", "Bengali"]
    venue: "Independent Research"
    description: "Stylometric analysis and self-similarity mapping of Bengali song lyrics, with an integrated web application to visualize the resulting linguistic patterns."
    abstract: >
      This project applies stylometric analysis and self-similarity mapping techniques to
      corpora of Bengali song lyrics, surfacing structural and linguistic patterns across
      artists and eras. An integrated web application renders these patterns as interactive
      visualizations, making the analysis explorable rather than static.

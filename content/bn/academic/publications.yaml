    tldr: >-
      একটি বিটল-অনুপ্রাণিত অপ্টিমাইজার একটি রোবটের পিআইডি কন্ট্রোলারকে ড্রাইভ করার সময় সুর করে৷ LiDAR SLAM এবং A*
      পুনঃ-পরিকল্পনার সাথে মিলিত, এটি একটি সর্বমুখী AGV কে প্লেইন PID কন্ট্রোলের চেয়ে ভাল অজানা স্থানগুলির মধ্য দিয়ে
      তার পথ খুঁজে পেতে দেয়।
    abstract: >-
      বিটল অ্যান্টেনা সার্চ (বিএএস) অ্যালগরিদম হল একটি সাম্প্রতিক অপ্টিমাইজেশান পদ্ধতি যা দীর্ঘ-শিং বিটলের চরণের আচরণ
      দ্বারা অনুপ্রাণিত। এর সহজ, ডেরিভেটিভ-মুক্ত কাঠামো সীমিত কম্পিউটিং ক্ষমতা সহ রোবটগুলির জন্য উপযুক্ত, তবুও বেশিরভাগ
      BAS নেভিগেশন অধ্যয়ন পৃথকভাবে পথ পরিকল্পনা এবং নিয়ন্ত্রণ পরিচালনা করে, অথবা শুধুমাত্র অফলাইনে BAS ব্যবহার করে। এই
      গবেষণাটি একটি সমন্বিত BAS-সক্ষম ন্যাভিগেশন ফ্রেমওয়ার্ক উপস্থাপন করে, যা যুগপত লোকালাইজেশন এবং ম্যাপিং (SLAM) এর
      সাথে মিলিত, কপেলিয়াসিমে একটি সর্বমুখী মোবাইল রোবটের জন্য। একটি LiDAR-ভিত্তিক অকুপেন্সি গ্রিড গতির সময় আপডেট করা
      হয়, একটি পরিবর্তিত A* অ্যালগরিদম মসৃণ সংঘর্ষ-মুক্ত পাথ তৈরি করে, এবং একটি BAS-চালিত অভিযোজিত পিআইডি কন্ট্রোলার
      প্রতিক্রিয়া হিসাবে ট্র্যাজেক্টরি বিচ্যুতি ব্যবহার করে তার লাভগুলিকে সুর করে। একটি নয়-সেন্সর ইনফ্রারেড অ্যারে
      লাইন ট্র্যাকিং পরিচালনা করে। কোনো বাধা ছাড়াই এবং তিন স্তরের বাধা ছাড়াই পরীক্ষা করা হয়েছে, সিস্টেমটি প্রচলিত
      পিআইডি-ভিত্তিক নেভিগেশনের চেয়ে SLAM এবং BAS-এর সাথে একসাথে ভাল পারফর্ম করেছে।

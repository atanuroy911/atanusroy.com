    date: "2025-09-01"
    category: news
    tags: [career, teaching, ulab]
    cover_image: ""
    summary: >
      Joined the Department of Computer Science & Engineering at the University
      of Liberal Arts Bangladesh (ULAB) as a Lecturer, teaching OS, DSA,
      Statistics, Software Engineering, and Embedded Systems.
    content: |
      ## A New Chapter

      I've joined the **University of Liberal Arts Bangladesh (ULAB)** as a
      Lecturer in the Department of Computer Science & Engineering, starting
      September 2025.

      ## Teaching

      This term I'm teaching undergraduate courses spanning **Operating
      Systems**, **Data Structures & Algorithms**, **Statistics**, **Software
      Engineering**, and **Embedded Systems**, and supervising capstone projects
      in computer vision, IoT, and robotics.

      ## Continuing Research

      Alongside teaching, I remain a remote Research Assistant with the Robotics
      & Automation Research Lab (RARL) at JXUST, continuing work on energy-aware
      AGV path planning and computer vision for agricultural monitoring.

    summary: >-
      যে মডেলগুলি ছবি এবং ভাষাকে সংযুক্ত করে, তাই একটি সিস্টেম যা দেখে তা বর্ণনা করতে পারে, একটি দৃশ্য সম্পর্কে প্রশ্নের
      উত্তর দিতে পারে এবং ভিজ্যুয়াল নির্দেশাবলী অনুসরণ করতে পারে৷
    intro: >-
      দৃষ্টি-ভাষা মডেলগুলি একজন ব্যক্তি যা বলে তার সাথে ক্যামেরা যা দেখে তা সংযুক্ত করে। আমি আগ্রহী যে তারা একটি ছবিতে
      কতটা ভাল **গ্রাউন্ড** ভাষা: তারা একটি কাজের জন্য গুরুত্বপূর্ণ বিশদগুলি লক্ষ্য করে কিনা এবং যেখানে তারা ব্যর্থ হয়।
      রোবটগুলির জন্য, সেই গ্রাউন্ডিং হল নির্দেশাবলী বোঝার প্রথম পদক্ষেপ যেমন "ল্যাপটপের পাশে কাপটি তুলে নিন"৷


      এই দিকটি আমার [কম্পিউটার দৃষ্টি](/research/computer-vision) কাজ থেকে বেড়েছে, যেখানে আমি ডিটেক্টর তৈরি করেছি যা
      ছোট ডিভাইসে এবং অগোছালো, বাস্তব-জগতের দৃশ্যে কাজ করতে হয়।
    questions:
      - VLM কতটা নির্ভরযোগ্যভাবে একটি চিত্রের সঠিক বস্তু এবং অঞ্চলে শব্দগুলিকে গ্রাউন্ড করে?
      - কিভাবে তারা ছোট এবং দ্রুত রোবট এবং প্রান্ত ডিভাইস চালানোর জন্য যথেষ্ট করা যেতে পারে?
      - কিভাবে তারা দৃশ্যে পরীক্ষা করা উচিত রোবট বাস্তবে দেখা, শুধু ওয়েব ইমেজ নয়?

  - title: "আরবানপার্ক: LoRaWAN-সক্ষম স্মার্ট পার্কিং মডিউল সহ পার্কিং পরিকাঠামোর অগ্রগতি"
    year: 2025
    type: conference
    venue: IEEE ICCIT 2025
    venue_full: 2025 কম্পিউটিং অ্যান্ড ইনফরমেশন টেকনোলজির (ICCIT), IEEE তে চতুর্থ আন্তর্জাতিক সম্মেলন
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - Z. H. Khan
      - S. Yang
    tldr: >-
      LoRaWAN সেন্সরগুলি একটি ড্রাইভার অ্যাপ এবং একটি অ্যাডমিন ড্যাশবোর্ডে রিয়েল টাইমে বিনামূল্যে পার্কিং স্পেস রিপোর্ট
      করে, সার্ভার হিসাবে একটি রাস্পবেরি পাই সহ।
    abstract: >-
      এই কাগজটি আরবানপার্ক উপস্থাপন করে, ক্রমবর্ধমান শহুরে পার্কিং চ্যালেঞ্জের জন্য একটি LoRaWAN-ভিত্তিক স্বায়ত্তশাসিত
      স্মার্ট পার্কিং ব্যবস্থা। এটি একটি মোবাইল অ্যাপ, একটি ওয়েব-ভিত্তিক অ্যাডমিন ইন্টারফেস এবং LoRaWAN-সক্ষম স্মার্ট
      পার্কিং মডিউলগুলিকে একত্রিত করে যাতে ড্রাইভার এবং অ্যাডমিনিস্ট্রেটরদের রিয়েল-টাইম পার্কিং উপলব্ধতা দেওয়া যায়।
      ড্রাইভাররা অ্যাপে স্পেস খুঁজে পেতে এবং রিজার্ভ করতে পারে, যখন অ্যাডমিনিস্ট্রেটররা ওয়েব থেকে সিস্টেম পরিচালনা করে।
      মডিউলগুলি তাদের নিজস্ব দখল নিরীক্ষণ করে এবং সার্ভার হিসাবে একটি রাস্পবেরি পাই ব্যবহার করে অল্প শক্তির সাথে দীর্ঘ
      দূরত্বে ডেটা পাঠায়। ফলাফল শহুরে পার্কিং ব্যবস্থাপনার জন্য একটি মাপযোগ্য, কম খরচে এবং টেকসই পদ্ধতি।

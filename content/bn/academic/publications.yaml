  - title: AGV (অটোমেটেড গাইডেড ভেহিকেল) ইন্ডাস্ট্রিয়াল রোবটে পিআইডি টিউনিং পদ্ধতি
    year: 2019
    type: journal
    venue: JSANTME
    venue_full: জার্নাল অফ সিমুলেশন অ্যান্ড অ্যানালাইসিস অফ নভেল টেকনোলজিস ইন মেকানিক্যাল ইঞ্জিনিয়ারিং
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - L. Liao
    tldr: >-
      কিভাবে প্রতিটি পিআইডি প্যারামিটার একটি বাস্তব AGV প্রভাবিত করে, এবং Ziegler-নিকলস থেকে অস্পষ্ট, নিউরাল এবং
      ইমিউন-অনুপ্রাণিত কন্ট্রোলারের সাথে টিউনিং পদ্ধতির তুলনা।
    abstract: >-
      PID কন্ট্রোল একটি ক্লাসিক সমাধান, সেরা সিস্টেম প্রতিক্রিয়ার জন্য সমানুপাতিক, অবিচ্ছেদ্য এবং ডেরিভেটিভ
      প্যারামিটারগুলি টিউন করে। শিল্প জুড়ে ব্যবহৃত AGVs, PID কন্ট্রোলারের উপর নির্ভর করে এবং শক্তির ক্ষতি, অদক্ষতা,
      পিছিয়ে এবং দৃঢ়তার অভাব এড়াতে প্রতিটিরই টিউনিং প্রয়োজন। এই কাগজটি PID কন্ট্রোলারের সাথে পরিচয় করিয়ে দেয়,
      একটি বাস্তব সিস্টেমে প্রতিটি প্যারামিটারের প্রভাব দেখায়, এবং AGV গতি এবং স্টিয়ারিং নিয়ন্ত্রণের জন্য ব্যবহৃত
      টিউনিং পদ্ধতির তুলনা করে, যার মধ্যে রয়েছে Lyapunov-এর সরাসরি পদ্ধতি, Ziegler-Nichols, ফাজি কন্ট্রোলার, হিউমারাল
      ইমিউন-সিস্টেম পদ্ধতি এবং নিউরাল নেটওয়ার্ক।

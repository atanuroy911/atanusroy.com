  - id: joined-backend-ace
    title: সফ্টওয়্যার এবং ডিওঅপস ইঞ্জিনিয়ার হিসাবে ব্যাকএন্ড এসে যোগদান করেছেন
    date: "2024-11-01"
    category: career
    tags:
      - career
      - devops
      - aws
      - laravel
    cover_image: ""
    summary: >-
      Backend Ace (NY, USA)-এ সফ্টওয়্যার এবং DevOps ইঞ্জিনিয়ার হিসাবে শুরু হয়েছে — Laravel/Next.js পণ্য এবং প্রকৃত
      ক্লায়েন্টদের জন্য পরিকাঠামো স্থানান্তরের সম্পূর্ণ স্ট্যাক কাজ৷
    content: |-
      ## নতুন ভূমিকা

      আমি **Backend Ace**, একটি NY-ভিত্তিক ডেভ শপ-এ সফটওয়্যার এবং DevOps ইঞ্জিনিয়ার হিসেবে যোগদান করেছি
      নভেম্বর 2024। কাজটি ব্যাকএন্ড (PHP/Laravel), ফ্রন্টএন্ড (Next.js/React) এবং
      পরিকাঠামো — আমি যেভাবে কাজ করতে পছন্দ করি তার জন্য একটি মিশ্রণ।

      ## আমি এতদূর যা পাঠিয়েছি

      - একটি ক্লায়েন্টের সার্ভার এবং DNS **DigitalOcean থেকে AWS**-এ স্থানান্তরিত হয়েছে, ডিপ্লয়মেন্ট সরানো হয়েছে
        EC2 দৃষ্টান্তে ডকার + জেনকিন্সে
      - আমদানি করা এবং পরিষ্কার করা **14,536 রেস্তোরাঁর রেকর্ড** (ছবি এবং পর্যালোচনা টানা সহ
        Google মানচিত্র থেকে) একটি ক্লায়েন্ট পণ্যের জন্য, ডিডুপ্লিকেট এবং পাইথনে পুনরায় ফর্ম্যাট করা হয়েছে৷
      - নতুন ডেটা সমর্থন করার জন্য নির্মিত ব্যাকএন্ড এবং ফ্রন্টএন্ড পরিবর্তনগুলি - ব্যাকএন্ডে লারাভেল,
        সামনের প্রান্তে Next.js
      - স্বাস্থ্যসেবা ক্লায়েন্টের জন্য একটি সম্পূর্ণ-স্ট্যাক মেডিকেল ওয়েবসাইট সরবরাহ করা হয়েছে (The Bronx Clinic, NY)

      তারা প্রকাশ্যে জাহাজ হিসাবে এই প্রতিটি উপর আরো.

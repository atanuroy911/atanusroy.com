    year: 2025
    tags:
      - Computer Vision
      - SLAM
      - Robotics
    venue: RARL, JXUST
    description: >-
      গভীরতার সেন্সর ব্যবহার করে একটি ইনডোর মোবাইল রোবটের জন্য দৃষ্টি-ভিত্তিক স্বায়ত্তশাসিত নেভিগেশন পাইপলাইন এবং
      রিয়েল-টাইমে গতিশীল পরিবেশের মানচিত্র করার জন্য একটি কাস্টম SLAM বাস্তবায়ন।
    abstract: >-
      আমরা একটি ভিশন-ভিত্তিক স্বায়ত্তশাসিত নেভিগেশন পাইপলাইন তৈরি করেছি যেটি গতিশীল গুদাম পরিবেশে অপারেটিং একটি ইনডোর
      মোবাইল রোবট। সিস্টেমটি ডেপথ সেন্সর (Intel RealSense D435) এবং একটি কাস্টম লাইটওয়েট SLAM ইমপ্লিমেন্টেশন ব্যবহার
      করে যা অকুপেন্সি গ্রিড উপস্থাপনা ব্যবহার করে রিয়েল-টাইমে পরিবেশকে ম্যাপ করে।

      একটি মূল চ্যালেঞ্জ ছিল চরম সেন্সর নয়েজ এবং টাইট কম্পিউট সীমাবদ্ধতা (NVIDIA Jetson Nano)। আমরা একটি প্রথাগত
      সম্ভাব্য রোডম্যাপ (PRM) পরিকল্পনাকারীর পাশাপাশি বাধা সনাক্তকরণের জন্য একটি লাইটওয়েট EfficientDet-ভিত্তিক নিউরাল
      নেটওয়ার্ক ব্যবহার করে এটি মোকাবেলা করেছি। হাইব্রিড পদ্ধতি বিশুদ্ধ শিক্ষা-ভিত্তিক পদ্ধতির তুলনায় গড় পথ
      পরিকল্পনার সময় 38% কমিয়ে দেয়।

      রোবটটি 200টি অদেখা ইনডোর লেআউট জুড়ে 94.2% টাস্ক সম্পূর্ণ করার হার অর্জন করেছে, যার গড় রিপ্ল্যানিং লেটেন্সি 120ms
      এর কম।

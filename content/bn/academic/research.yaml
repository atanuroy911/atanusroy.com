  - slug: robotic-simulation
    title: রোবোটিক সিমুলেশন
    status: বর্তমান ফোকাস
    image: /images/papers/agv-ir-simulation.jpg
    image_alt: CoppeliaSim সিমুলেটরে একটি চিত্র-আট ট্র্যাক অনুসরণ করে বেশ কয়েকটি AGV
    summary: >-
      CoppeliaSim, Gazebo এবং MATLAB-এর মতো সিমুলেটর ব্যবহার করে বাস্তব জগতে দৌড়ানোর আগে রোবট ডিজাইন, প্রশিক্ষণ এবং
      পরীক্ষা করা।
    intro: >-
      আমার বেশিরভাগ রোবোটিক্স কাজ সিমুলেশনে শুরু হয়। আমি স্বয়ংক্রিয় নির্দেশিত যানবাহন (AGV), টিউন কন্ট্রোলার এবং
      তুলনা সেন্সরগুলির জন্য নেভিগেশন বিকাশ করতে CoppeliaSim, ROS/Gazebo এবং MATLAB ব্যবহার করেছি, তারপর পরীক্ষা করে
      দেখেছি যে ফলাফলগুলি বাস্তব রোবটগুলিতে কতটা ভালভাবে বহন করে।


      হাইলাইটগুলির মধ্যে রয়েছে সর্বমুখী রোবটের জন্য একটি [বিটল-অনুপ্রাণিত নেভিগেশন
      ফ্রেমওয়ার্ক](/blog/beetle-antennae-agv-2026), [অনেক AGV-এর জন্য ট্রাফিক
      ব্যবস্থাপনা](/blog/agv-ir-timed-automata-2024) একই পথ ভাগ করা, এবং [FOODIEBOT](/blog/foodiebot-ieee-access-2024)
      পরিষেবা রোবট, যার সিমুলেটেড এবং বাস্তব কার্যকারিতা ঘনিষ্ঠভাবে মিলেছে। এর বেশিরভাগই [রোবোটিক্স ও অটোমেশন রিসার্চ
      ল্যাব (RARL)](https://www.rarl-lab.com) দিয়ে করা হয়েছিল। আজ আমি ডেটা তৈরি করতে এবং পরীক্ষা করার জন্য সিমুলেশন
      ব্যবহার করি [দৃষ্টি-ভাষা-অ্যাকশন মডেল](/research/vision-language-action-models)।
    questions:
      - কিভাবে সিমুলেটেড প্রশিক্ষণ তথ্য বাস্তব বিশ্বের সাথে ব্যবধান বন্ধ করতে পারে?
      - আমরা কীভাবে সিমুলেটেড পরীক্ষা তৈরি করব যা বাস্তব-রোবটের কর্মক্ষমতা ভবিষ্যদ্বাণী করে?

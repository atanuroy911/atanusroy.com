  - title: "মনোযোগী-ইওলো: দক্ষ চ্যানেলের মনোযোগ ব্যবহার করে অন-সাইট জলের পাইপলাইন পরিদর্শন এবং ELAN-ভিত্তিক YOLOv7 হ্রাস করা"
    year: 2024
    type: conference
    venue: VISAPP 2024
    venue_full: >-
      কম্পিউটার ভিশন, ইমেজিং এবং কম্পিউটার গ্রাফিক্স থিওরি অ্যান্ড অ্যাপ্লিকেশন (VISIGRAPP 2024), ভলিউম। 4 VISAPP,
      492-499
    authors:
      - A. S. Roy
      - P. Bagade
    image: /images/papers/attentive-yolo-architecture.jpg
    image_alt: >-
      Attentive-YOLO এর আর্কিটেকচার ডায়াগ্রাম, ইনপুট ইমেজ থেকে ECAM মনোযোগ এবং R-ELAN ব্লকের মাধ্যমে সনাক্তকরণ আউটপুট
      পর্যন্ত
    tldr: >-
      চ্যানেল মনোযোগ সহ একটি হালকা YOLOv7 রাস্পবেরি পাইতে জল-পাইপের ত্রুটি খুঁজে পায়: mAP 0.962 বনাম 0.93
      YOLOv7-ক্ষুদ্র, প্রায় 20% কম প্যারামিটার সহ।
    abstract: >-
      পরিষ্কার জল সরবরাহ করা জলের পাইপগুলির সময়মত পরিদর্শন এবং মেরামতের উপর নির্ভর করে। ঐতিহ্যগত পরিদর্শনের জন্য
      ব্যয়বহুল ম্যানুয়াল কাজ এবং সাইটে বিশেষজ্ঞদের প্রয়োজন, এবং রিয়েল-টাইম স্বয়ংক্রিয় সনাক্তকরণের অভাব রয়েছে।
      রেটিনেক্স-ভিত্তিক আলোকসজ্জা সহ YOLOv5-এর মতো বর্তমান পদ্ধতিগুলি গ্রহণযোগ্যভাবে সঞ্চালন করে তবে প্রান্ত
      ডিভাইসগুলিতে দ্রুত অনুমান করার জন্য এটি খুব ভারী। এই কাগজটি মনোযোগী-YOLO প্রস্তাব করেছে, YOLOv7 এর উপর ভিত্তি করে
      একটি হ্রাসকৃত দক্ষ লেয়ার অ্যাগ্রিগেশন নেটওয়ার্ক (ELAN) এবং মাথা এবং মেরুদণ্ডে একটি হালকা মনোযোগ মডিউল, মডেলের
      আকার কাটার সময় সঠিকতা উন্নত করে। এটি আইওটি সিস্টেম এবং পাইপলাইন পরিদর্শন রোবটের জন্য রাস্পবেরি পাই-এর মতো প্রান্ত
      ডিভাইসগুলির জন্য ডিজাইন করা হয়েছে। Attentive-YOLO 0.962 একটি mAP অর্জন করে, YOLOv7-এর জন্য 0.93-এর তুলনায়
      এক-তৃতীয়াংশ চ্যানেল প্রস্থে, প্রায় 20% কম প্যারামিটার সহ।

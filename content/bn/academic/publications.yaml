  - title: >-
      একটি সুরক্ষিত ট্রাফিক পুলিশ রিমোট সেন্সিং পদ্ধতির মাধ্যমে একটি গভীর শিক্ষা-ভিত্তিক লো-অল্টিটিউড ভেহিকল স্পিড

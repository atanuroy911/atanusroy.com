bio: >
  I am a Lecturer in the Department of Computer Science & Engineering at the
  University of Liberal Arts Bangladesh. I hold an M.Tech in Computer Science &
  Engineering from IIT Kanpur (2022-2024), where I worked on deep learning-based
  pipeline inspection systems. My research spans Computer Vision, Robotics, IoT,
  and Embedded Systems across three countries - Bangladesh, India, and China.
research_interests:
  - Computer Vision & Object Detection
  - Autonomous Guided Vehicles (AGV)
  - IoT & Embedded Systems
  - Deep Learning on Edge Devices
  - Smart City Infrastructure

  - title: "একটি নতুন আইওটি-সক্ষম পোর্টেবল, সুরক্ষিত স্বয়ংক্রিয় স্ব-বক্তৃতা উপস্থিতি সিস্টেম: নকশা, উন্নয়ন এবং তুলনা"
    year: 2024
    type: journal
    venue: IJESDF
    venue_full: ইন্টারন্যাশনাল জার্নাল অফ ইলেকট্রনিক সিকিউরিটি অ্যান্ড ডিজিটাল ফরেনসিক 16(6), ইন্ডারসায়েন্স
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - H. Ghorbani
      - H. Lotfi
      - X. Zhang
      - L. Liao
      - M. Gheisari
    tldr: >-
      শিক্ষার্থীরা একটি ছোট IoT ডিভাইসে একটি ফোন এবং একটি QR কোড দিয়ে তাদের নিজেদের উপস্থিতি চিহ্নিত করে, সস্তায় এবং
      নিরাপত্তা ও গোপনীয়তা সহ। একটি লাইভ লেকচারে পরীক্ষা করা হয়।
    abstract: >-
      শিক্ষার্থীদের উপস্থিতির বিষয়গুলি পর্যবেক্ষণ করা, কিন্তু বিদ্যমান ট্র্যাকিং পদ্ধতিগুলি ব্যয়বহুল, ধীর বা ভুল এবং
      প্রায়শই নিরাপত্তা এবং গোপনীয়তা উপেক্ষা করে। এই কাগজটি SLAS উপস্থাপন করে, একটি অভিনব IoT-ভিত্তিক স্ব-বক্তৃতা
      উপস্থিতি সিস্টেম যা স্মার্টফোন এবং QR কোড ব্যবহার করে। উপস্থিতি ট্র্যাকিং সহজ রাখার সময় এটি নিরাপত্তা এবং
      গোপনীয়তাকে সম্বোধন করে এবং এটি শিক্ষক ও শিক্ষার্থীদের জন্য কমপ্যাক্ট, সাশ্রয়ী, মাপযোগ্য এবং নমনীয়। একটি লাইভ
      বক্তৃতায় পরীক্ষাগুলি দেখিয়েছে যে সিস্টেমটি কার্যকর এবং সঠিক।

  - slug: vision-language-action-models
    title: দৃষ্টি-ভাষা-অ্যাকশন মডেল (ভিএলএ)
    status: বর্তমান ফোকাস
    summary: মডেল যা একটি রোবট যা দেখে এবং যা বলা হয় তা ক্রিয়ায় পরিণত করে, নেভিগেশন থেকে জিনিস তোলা পর্যন্ত।
    intro: >-
      দৃষ্টি-ভাষা-অ্যাকশন মডেলগুলি VLM-এর চেয়ে এক ধাপ এগিয়ে যায়: তারা একটি চিত্র এবং একটি নির্দেশকে সরাসরি রোবট
      অ্যাকশনে পরিণত করে। আমি এই নীতিগুলি বাস্তব রোবটের উপর নির্ভরযোগ্য করে তুলতে আগ্রহী, যেখানে ছোট ত্রুটিগুলি পুরো
      টাস্কে যোগ করে।


      আমার আগের রোবোটিক্সের কাজ, [AGV নেভিগেশন](/research/robotic-simulation), পিআইডি কন্ট্রোল এবং সার্ভিস রোবট, আমাকে
      শিখিয়েছে গতি এবং নিয়ন্ত্রণের বিষয়ের নিম্ন-স্তরের বিশদ কত। আমি VLA গুলিকে কীভাবে দেখি সেই অভিজ্ঞতাটি আকার দেয়।
    questions:
      - একটি কাজের মাধ্যমে একটি ক্রিয়া ভুল হয়ে গেলে কীভাবে VLA নীতিগুলি পুনরুদ্ধার করতে পারে?
      - >-
        তাদের প্রশিক্ষণ দেওয়ার সময় কতটা [সিমুলেশন](/research/robotic-simulation) ব্যয়বহুল বাস্তব-রোবট ডেটা
        প্রতিস্থাপন করতে পারে?
      - কিভাবে আমরা তাদের কাজ এবং রোবট জুড়ে ন্যায্যভাবে পরীক্ষা করব?

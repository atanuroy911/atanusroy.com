bio: >-
  রোবটগুলি সরল ভাষায় নির্দেশাবলী দেখতে, বুঝতে এবং তাদের উপর কাজ করতে শুরু করেছে। সেই কাজটি নির্ভরযোগ্যভাবে করতে যা লাগে
  তাতে আমি আগ্রহী। আমার বর্তমান গবেষণা দৃষ্টি-ভাষা মডেল (VLMs) এবং দৃষ্টি-ভাষা-অ্যাকশন মডেল (VLAs), রোবোটিক সিমুলেশন এবং
  কম্পিউটার ভিশনের উপর দৃষ্টি নিবদ্ধ করে: কীভাবে রোবটগুলি তারা যা দেখে তাতে গ্রাউন্ড ল্যাঙ্গুয়েজ করতে পারে এবং বাস্তব
  জগতের সাথে দেখা করার আগে তাদের প্রশিক্ষণ এবং পরীক্ষা করার জন্য কীভাবে সিমুলেশন ব্যবহার করা যেতে পারে। এটি সাইট
  পরিদর্শনের জন্য লাইটওয়েট ডিপ লার্নিং, যেমন রাস্পবেরি পাইতে জলের পাইপের ত্রুটিগুলি খুঁজে বের করা এবং অজানা এবং
  জনাকীর্ণ স্থানে স্বয়ংক্রিয় নির্দেশিত যানবাহনের জন্য নেভিগেশনের উপর আমার আগের কাজের উপর ভিত্তি করে তৈরি করে।

  আমি ইউনিভার্সিটি অফ লিবারেল আর্টস বাংলাদেশ (ইউল্যাব)-এর কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং-এর একজন প্রভাষক,
  যেখানে আমি কম্পিউটার ভিশন, আইওটি এবং রোবোটিক্সে ক্যাপস্টোন প্রকল্পগুলি শেখাই এবং তত্ত্বাবধান করি। আমি এখন যুক্তরাজ্যের
  লিসেস্টারে অবস্থিত রোবোটিক্স অ্যান্ড অটোমেশন রিসার্চ ল্যাবের (RARL) সদস্য। ULAB-এর আগে, আমি IIT কানপুরে (2022-2024)
  কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং-এ আমার M.Tech সম্পন্ন করেছি, ডঃ প্রিয়াঙ্কা বাগাদে পরামর্শে, IoT ভিশন ল্যাবে
  গবেষণা সহকারী হিসেবে কাজ করছেন ভারতের জল জীবন মিশনের অধীনে জলের পাইপলাইন পরিদর্শনের জন্য গভীর শিক্ষার বিষয়ে। আমি আমার
  B.E করেছি। ডক্টর আতা জাহাঙ্গীর মোশায়েদীর পরামর্শে চীনের জিয়াংজি ইউনিভার্সিটি অফ সায়েন্স অ্যান্ড টেকনোলজিতে
  কম্পিউটার সায়েন্স অ্যান্ড টেকনোলজিতে, যেখানে আমি প্রথম 2018 সালে RARL এ যোগদান করি।

  গবেষণার বাইরে, আমি গিটার বাজানো, গান গাইতে এবং ভ্রমণ ✈️ উপভোগ করি।

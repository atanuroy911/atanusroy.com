  - title: "Robot Assistant X — Your Personal ChatBot"
    year: 2023
    tags: ["NLP", "Robotics", "Edge AI", "Mobile"]
    venue: "Independent Research"
    description: "An NLP-driven voice assistant running on Raspberry Pi, paired with a Flutter companion app for interactive, voice-controlled human-robot interaction."
    abstract: >
      Robot Assistant X implements an NLP model on a Raspberry Pi using TensorFlow to provide
      interactive, voice-controlled assistance at the edge — without depending on a cloud
      round-trip for every query. A companion mobile application, built with Flutter, extends
      the assistant's reach and improves the human-robot interaction loop.
    image: ""
    paper_link: ""
    github_link: ""
    demo_link: ""
    blog_link: ""
  - title: "Welding Defect Detection using Improved YOLOv7"
    year: 2023
    tags: ["Computer Vision", "YOLOv7", "Edge AI", "Industrial Inspection"]
    venue: "Independent Research"
    description: "An Efficient Channel Attention-enhanced YOLOv7 model for automated welding defect detection, optimized for deployment on resource-constrained IoT edge devices."
    abstract: >
      This project integrates an Efficient Channel Attention (ECA) mechanism into YOLOv7 to
      improve detection accuracy for welding defects, then optimizes the resulting model for
      deployment on resource-constrained IoT edge devices — targeting inspection scenarios
      where a full-size model isn't practical.

  - title: "FOODIEBOT রোবটের ডিজাইন এবং বিকাশ: সিমুলেশন থেকে ডিজাইন পর্যন্ত"
    year: 2024
    type: journal
    venue: IEEE Access
    venue_full: IEEE অ্যাক্সেস 12, 36148–36172
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - L. Liao
      - A. S. Khan
      - A. Kolahdooz
      - A. Eftekhari
    tldr: >-
      একটি খাদ্য পরিবেশনকারী রোবট যার পিআইডি কন্ট্রোলারটি চারটি অপ্টিমাইজার (BAS, PSO, POA, EO) সহ সিমুলেশনে টিউন করা
      হয়েছে৷ BAS দ্রুততম ছিল, এবং আসল রান সিমুলেশনের সাথে মিলেছিল।
    abstract: >-
      এই কাজটি FOODIEBOT এর ডিজাইন এবং বিকাশকে কভার করে, একটি অভিযোজিত পরিষেবা রোবট যা ইমেজ প্রসেসিং, একটি মোবাইল অ্যাপ
      এবং ডাইনিং হলের বস্তুগুলি পরিচালনা করার জন্য একটি ওয়েব ইন্টারফেস ব্যবহার করে৷ এর পিআইডি কন্ট্রোলার ক্যালিব্রেট
      করা অপরিহার্য ছিল, তাই মডেলটি MATLAB-তে সিমুলেট করা হয়েছিল এবং চারটি অপ্টিমাইজেশান পদ্ধতি ব্যবহার করে বৃত্তাকার,
      উপবৃত্তাকার, সর্পিল এবং অষ্টভুজাকার পথে পরীক্ষা করা হয়েছিল: BAS, PSO, POA এবং EO। বিএএস ছিল সবচেয়ে দক্ষ, প্রতিটি
      পথে সবচেয়ে কম কার্যকর করার সময় এবং একটি পথে সর্বোত্তম নির্ভুলতা; EO এবং POA অন্যদের জন্য সবচেয়ে সঠিক ছিল, এবং
      PSO তিনটি পথে সর্বোচ্চ গতিতে পৌঁছেছে। সিমুলেটেড এবং বাস্তব-বিশ্বের কর্মক্ষমতা ঘনিষ্ঠভাবে মিলেছে, নিশ্চিত করে যে
      সিমুলেশন নির্ভরযোগ্যভাবে রোবটের পিআইডি মানগুলি অর্জন করতে পারে।
    doi: 10.1109/ACCESS.2024.3355278

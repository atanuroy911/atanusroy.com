  - title: আইওটি স্মার্ট এগ্রিকালচার প্ল্যাটফর্ম
    year: 2024
    tags:
      - IoT
      - LoRaWAN
      - Machine Learning
    venue: IoT Vision Lab, IIT Kanpur
    description: >-
      মাটির আর্দ্রতা নিরীক্ষণ এবং সেচের প্রয়োজনীয়তা অনুমান করতে LoRaWAN ব্যবহার করে নিম্ন-শক্তি, প্রশস্ত-এরিয়া IoT
      প্ল্যাটফর্ম, একটি ভবিষ্যদ্বাণীমূলক ML ব্যাকএন্ড সহ কাস্টম সেন্সর নোড স্থাপন করে।
    abstract: >-
      আমরা কৃষিক্ষেত্র জুড়ে মাটির আর্দ্রতা, পরিবেষ্টিত তাপমাত্রা এবং আর্দ্রতা নিরীক্ষণের জন্য LoRaWAN ক্লাস A ডিভাইস
      ব্যবহার করে একটি কম-পাওয়ার, ওয়াইড-এরিয়া IoT প্ল্যাটফর্ম ডিজাইন করেছি। প্রকল্পটিতে কাস্টম সেন্সর নোডের
      হার্ডওয়্যার ডিজাইন জড়িত ছিল (STM32L476 MCU + ক্যাপাসিটিভ সয়েল সেন্সর + SX1276 LoRa ট্রান্সসিভার) যা 2× AA কোষে
      18 মাসের বেশি ব্যাটারি লাইফ অর্জন করে।

      একটি কেন্দ্রীয় ক্লাউড ব্যাকএন্ড (AWS IoT Core + Lambda) সেন্সর টেলিমেট্রিকে একত্রিত করে এবং একটি
      গ্রেডিয়েন্ট-বুস্টেড ট্রি মডেল (XGBoost) চালায় যাতে 48 ঘন্টা আগে সর্বোত্তম সেচের সময়সূচী অনুমান করা যায়, 3
      বছরের স্থানীয় জলবায়ু এবং ফসলের ডেটার উপর প্রশিক্ষিত।

      উত্তরপ্রদেশের 5টি খামার জুড়ে মাঠ পরীক্ষায় সমতুল্য বা উচ্চতর ফসলের ফলন বজায় রেখে জলের ব্যবহার 31% হ্রাস পেয়েছে।
      প্ল্যাটফর্মটি ~2কিমি ইনডোর এবং ~10কিমি আউটডোর রেঞ্জ সহ গেটওয়ে প্রতি 512টি সেন্সর নোড সমর্থন করে৷

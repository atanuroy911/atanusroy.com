  - title: "Automation Attendance Systems Approaches: A Practical Review"
    year: 2021
    type: journal
    venue: BOHR IJIoT
    venue_full: BOHR International Journal of Internet of Things Research 1, 23–31
    authors: [A. J. Moshayedi, A. S. Roy, L. Liao, H. Lan, M. Gheisari, A. Abbasi]
    tldr: >-
      A review of the technologies behind automatic attendance: biometrics, RFID,
      Bluetooth, GPS and QR codes.
    abstract: >-
      Keeping track of people is the first step for any organization, and building
      and maintaining an attendance system costs money and effort. That is a
      formality for large organizations, but a real burden for schools, colleges and
      universities. Many technologies have been used to collect attendance,
      including biometrics, RFID, Bluetooth, GPS and QR codes. This study reviews the
      practical methods and technologies used in existing attendance systems to
      guide future research.
    doi: 10.54646/bijiotr.003
    open_access: true
    post: attendance-systems-review-2021

  - title: Raspberry Pi SCADA Zonal Based System for Agricultural Plant Monitoring
    year: 2019
    type: conference
    venue: IEEE ICISCE 2019
    venue_full: 2019 6th International Conference on Information Science and Control Engineering (ICISCE), IEEE, 427–433
    authors: [A. J. Moshayedi, A. S. Roy, L. Liao, S. Li]
    tldr: >-
      A low-cost, web-based SCADA system for farms, hosted on a Raspberry Pi and
      split into zones for security, with local and remote monitoring.
    abstract: >-
      SCADA and DCS systems are central to industrial automation, but software cost
      and limited extensibility keep them out of reach for small industries, and IoT
      brings new security challenges. This paper designs and compares two small
      SCADA systems for agriculture that reduce size and use a zonal method to
      address security. A Raspberry Pi replaces a PC or laptop as the host, cutting
      cost and size, a design not reported before. A web-based SCADA system
      provides local and remote monitoring of an agricultural plant environment over
      a Raspberry Pi network.
    doi: 10.1109/ICISCE48695.2019.00092
    post: raspberry-pi-scada-2019

  - title: PID Tuning Method on AGV (Automated Guided Vehicle) Industrial Robot
    year: 2019
    type: journal
    venue: JSANTME
    venue_full: Journal of Simulation and Analysis of Novel Technologies in Mechanical Engineering
    authors: [A. J. Moshayedi, A. S. Roy, L. Liao]
    tldr: >-
      How each PID parameter affects a real AGV, and a comparison of tuning methods
      from Ziegler–Nichols to fuzzy, neural and immune-inspired controllers.
    abstract: >-
      PID control remains a classic solution, tuning proportional, integral and
      derivative parameters for the best system response. AGVs, used across
      industry, rely on PID controllers, and each needs tuning to avoid energy loss,
      inefficiency, lag and lack of robustness. This paper introduces the PID
      controller, shows the effect of each parameter on a real system, and compares
      tuning methods used for AGV speed and steering control, including Lyapunov's
      direct method, Ziegler–Nichols, fuzzy controllers, the humoral immune-system
      method and neural networks.
    url: http://jsme.iaukhsh.ac.ir/article_673338_5f03b3a8af1fae3009190d0c21b8b518.pdf
    open_access: true
    post: pid-tuning-agv-2019

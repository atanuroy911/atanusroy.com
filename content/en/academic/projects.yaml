  - title: "Activity Recognition Application using LSTM"
    year: 2023
    tags: ["Deep Learning", "LSTM", "Mobile", "Cloud"]
    venue: "Personal Project"
    description: "An LSTM-based sensor activity recognition model deployed to the cloud, paired with a companion mobile app for real-time monitoring and prediction."
    abstract: >
      This project trains an LSTM model in PyTorch for sensor-based human activity recognition
      and deploys it as a cloud-hosted inference service. A companion mobile app streams live
      sensor data to the model and surfaces real-time activity predictions to the user.
    image: ""

    title: "ট্র্যাফিক পুলিশ হিসাবে ড্রোন: একটি গভীর শিক্ষার যানবাহন গতি সনাক্তকারী"
    date: "2023-02-03"
    category: publication
    tags:
      - uav
      - deep-learning
      - smart-city

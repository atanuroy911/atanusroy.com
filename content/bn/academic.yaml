bio: >-
  আমি ইউনিভার্সিটি অফ লিবারেল আর্টস বাংলাদেশ-এর কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং বিভাগের একজন প্রভাষক। আমি IIT
  কানপুর (2022-2024) থেকে কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং-এ M.Tech করেছি, যেখানে আমি গভীর শিক্ষা-ভিত্তিক
  পাইপলাইন পরিদর্শন সিস্টেমে কাজ করেছি। আমার গবেষণাটি তিনটি দেশে কম্পিউটার ভিশন, রোবোটিক্স, আইওটি এবং এমবেডেড সিস্টেম
  নিয়ে বিস্তৃত - বাংলাদেশ, ভারত এবং চীন।

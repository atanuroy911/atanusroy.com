  - title: "IoT Smart Agriculture Platform"
    year: 2024
    tags: ["IoT", "LoRaWAN", "Machine Learning"]
    venue: "IoT Vision Lab, IIT Kanpur"
    description: "Low-power, wide-area IoT platform using LoRaWAN to monitor soil moisture and predict irrigation needs, deploying custom sensor nodes with a predictive ML backend."
    abstract: >
      We designed a low-power, wide-area IoT platform using LoRaWAN Class A devices to monitor soil moisture, ambient temperature, and humidity across agricultural fields. The project involved hardware design of custom sensor nodes (STM32L476 MCU + capacitive soil sensor + SX1276 LoRa transceiver) achieving a battery life exceeding 18 months on 2× AA cells.

      A central cloud backend (AWS IoT Core + Lambda) aggregates sensor telemetry and runs a gradient-boosted tree model (XGBoost) to predict optimal irrigation schedules 48 hours ahead, trained on 3 years of local climate and crop data.

      Field trials across 5 farms in Uttar Pradesh showed a 31% reduction in water usage while maintaining equivalent or higher crop yields. The platform supports up to 512 sensor nodes per gateway with ~2km indoor and ~10km outdoor range.

  - id: slas-competition-win
    title: "SLAS Won 2nd Prize in the Central China Innovation Competition"
    date: "2020-01-15"
    category: career
    tags: [award, wechat, attendance, java]
    cover_image: ""
    summary: >
      Self-Lecture Attendance System (SLAS), a WeChat Mini Program I built for secure
      QR-based attendance, won 2nd Prize in Central China's "Internet+" Innovation
      Competition and the 7th "Discovery Cup."
    content: |
      ## What SLAS Does

      SLAS is a full-stack QR-based attendance system built as a **WeChat Mini Program**
      with a **Java Spring Boot** backend, letting institutions record attendance securely
      without extra hardware — just the phone students already carry.

      ## Recognition

      The project won **2nd Prize** in the Central China "Internet+" Innovation Competition
      and the **7th "Discovery Cup"** in China, and later formed the basis of a registered
      software copyright (SLAS, Copyright No. 2020SR0058411).

      It also fed directly into later academic work on IoT-based self-lecture attendance
      systems.
    github: ""
    link: ""
    pinned: false

  - id: joined-ulab-2023
    title: ইউল্যাবে CSE-তে প্রভাষক হিসেবে যোগদান করেছেন
    date: "2023-09-01"
    category: news
    tags:
      - career
      - teaching
      - ulab
    cover_image: ""
    summary: >-
      ইউনিভার্সিটি অব লিবারেল আর্টস বাংলাদেশ (ইউল্যাব)-এর কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং বিভাগে প্রভাষক হিসেবে
      যোগদান করেন।
    content: |-
      ## একটি নতুন অধ্যায়

      আমি ঘোষণা করতে পেরে আনন্দিত যে আমি **ইউনিভার্সিটি অফ লিবারেল আর্টস বাংলাদেশ (ইউল্যাব)** এ যোগদান করেছি
      সেপ্টেম্বর 2023 থেকে কম্পিউটার সায়েন্স অ্যান্ড ইঞ্জিনিয়ারিং বিভাগের প্রভাষক হিসেবে।

      ## শিক্ষাদানের দায়িত্ব

      এই ভূমিকায় আমি শিক্ষা দেব:

      - **CSE 103** — প্রোগ্রামিং এর ভূমিকা (C/C++)
      - **CSE 207** — ডেটা স্ট্রাকচার এবং অ্যালগরিদম
      - **CSE 415** — কম্পিউটার ভিশন (ইলেক্টিভ)

      ## গবেষণার ধারাবাহিকতা

      শিক্ষাদানের পাশাপাশি, আমি স্বায়ত্তশাসিত সিস্টেম এবং কম্পিউটার দৃষ্টিতে আমার গবেষণা চালিয়ে যাব,
      দক্ষিণ এশীয় প্রেক্ষাপটের সাথে প্রাসঙ্গিক অ্যাপ্লিকেশনগুলির উপর ফোকাস সহ — নিম্ন-শক্তি সহ
      কৃষি অটোমেশন জন্য এমবেডেড দৃষ্টি.

      আমি অনুপ্রাণিত শিক্ষার্থীদের সাথে কাজ করার এবং ULAB এর বৃদ্ধিতে অবদান রাখার জন্য উন্মুখ
      গবেষণা সংস্কৃতি।

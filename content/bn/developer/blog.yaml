    summary: >-
      সেল্ফ-লেকচার অ্যাটেনডেন্স সিস্টেম (SLAS), একটি ওয়েচ্যাট মিনি প্রোগ্রাম যা আমি নিরাপদ QR-ভিত্তিক উপস্থিতির জন্য
      তৈরি করেছি, মধ্য চীনের "ইন্টারনেট+" উদ্ভাবন প্রতিযোগিতা এবং 7তম "ডিসকভারি কাপ"-এ দ্বিতীয় পুরস্কার জিতেছে৷
    content: |-
      ## SLAS কি করে

      SLAS হল একটি ফুল-স্ট্যাক QR-ভিত্তিক উপস্থিতি সিস্টেম যা একটি **WeChat Mini Program** হিসেবে নির্মিত
      একটি **জাভা স্প্রিং বুট** ব্যাকএন্ড সহ, প্রতিষ্ঠানগুলিকে নিরাপদে উপস্থিতি রেকর্ড করতে দেয়
      অতিরিক্ত হার্ডওয়্যার ছাড়া - শুধু ফোন শিক্ষার্থীরা ইতিমধ্যে বহন করে।

      ## স্বীকৃতি

      প্রকল্পটি মধ্য চীন "ইন্টারনেট+" উদ্ভাবন প্রতিযোগিতায় **২য় পুরস্কার** জিতেছে
      এবং চীনে **7ম "ডিসকভারি কাপ"**, এবং পরে একটি নিবন্ধিত ভিত্তি তৈরি করে

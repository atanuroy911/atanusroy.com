  - title: "AGV-এর জন্য পথ পরিকল্পনা: কম্পিউটেশনাল দক্ষতা এবং সর্বোত্তমতার ভারসাম্য"
    year: 2025
    type: conference
    venue: IEEE ICRAIC 2025
    venue_full: 2025 রোবোটিক্স, অটোমেশন এবং ইন্টেলিজেন্ট কন্ট্রোল (ICRAIC), IEEE এর উপর 5 তম আন্তর্জাতিক সম্মেলন
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - Z. H. Khan
      - S. Yang
      - A. Razi
      - M. E. Andani
    tldr: >-
      ছয়টি চার্জিং স্টেশন পরিদর্শনকারী একটি বৈদ্যুতিক AGV-এর তুলনায় এগারোটি ধ্রুপদী পথ পরিকল্পনাকারী। Floyd-Warshall
      সর্বনিম্ন খরচ এবং শক্তি স্কোর দিয়েছেন; TSP এবং Prim's MST সবচেয়ে বেশি স্টেশন কভার করেছে।
    abstract: >-
      অটোমেটেড গাইডেড ভেহিক্যালস (AGVs) শিল্প অটোমেশনে উপাদান হ্যান্ডলিং এবং লজিস্টিককে স্ট্রিমলাইন করে। এই পেপারটি
      অ্যাকারম্যান-স্টিয়ারড বৈদ্যুতিক AGV-তে একটি সিমুলেটেড শহুরে পরিবেশে ছয়টি চার্জিং স্টেশনে নেভিগেট করে ডিজকস্ট্রা,
      ডেপথ ফার্স্ট সার্চ, ফ্লয়েড-ওয়ারশাল, বাইনারি সার্চ এবং প্রিমস এমএসটি সহ এগারোটি ক্লাসিক্যাল পাথফাইন্ডিং
      অ্যালগরিদম মূল্যায়ন করে। অ্যালগরিদমগুলি বাই স্টেশন এবং বাই এজ-এ বিভক্ত। কর্মক্ষমতা রানটাইম, ভ্রমণের দূরত্ব, খরচ,
      গতি এবং স্টেশন পরিদর্শন দ্বারা পরিমাপ করা হয়, পাশাপাশি একটি নতুন শক্তি খরচ স্কোর (ECS) যা কম্পিউটেশনাল ওভারহেডের
      সাথে অপারেশনাল দক্ষতার ভারসাম্য বজায় রাখে। Floyd–Warshall সর্বোত্তম সামগ্রিক খরচ এবং ECS অর্জন করেছে; স্টেশন
      কভারেজের জন্য TSP এবং Prim-এর MST সেরা ছিল; প্রান্ত-ভিত্তিক অ্যালগরিদমগুলি পূর্বনির্ধারিত রুটে নির্ভরযোগ্য ছিল
      কিন্তু সামগ্রিকভাবে কম দক্ষ।

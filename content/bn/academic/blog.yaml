      আইওটি রিসার্চের BOHR ইন্টারন্যাশনাল জার্নাল-এ আমাদের ওপেন-অ্যাক্সেস পর্যালোচনা স্বয়ংক্রিয় উপস্থিতি সিস্টেমের
      পিছনে থাকা প্রযুক্তিগুলির তুলনা করে।
    content: |-
      ## সমস্যা

      মানুষের ট্র্যাক রাখা অর্থ এবং প্রচেষ্টা খরচ. বড় কোম্পানির জন্য এটি একটি
      আনুষ্ঠানিকতা, তবে স্কুল, কলেজ ও বিশ্ববিদ্যালয়ের জন্য ভবনের খরচ
      এবং একটি উপস্থিতি সিস্টেম চলমান যোগ করা হয়.

      ## আমরা যা পর্যালোচনা করেছি

      আতা জাহাঙ্গীর মোশায়েদী এবং সহকর্মীদের সাথে, আমি ব্যবহারিক উপস্থিতি পর্যালোচনা করেছি
      সিস্টেমের উপর নির্মিত:

      - বায়োমেট্রিক্স
      - আরএফআইডি
      - ব্লুটুথ
      - জিপিএস
      - QR কোড

      গবেষকদের বিল্ডিং গাইড করার জন্য এখন পর্যন্ত কী কাজ করেছে তা পর্যালোচনায় তুলে ধরা হয়েছে
      উপস্থিতি সিস্টেমের পরবর্তী প্রজন্ম। এটি আমাদের নিজস্ব আইওটি-তেও খাওয়ানো হয়েছে
      স্ব-বক্তৃতা উপস্থিতি সিস্টেম।


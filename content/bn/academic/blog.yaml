    content: |-
      ## পর্যালোচনা কি কভার করে

      আতা জাহাঙ্গীর মোশায়েদী, আমিন কোলাহদুজ এবং ইয়াং শুক্সিনের সাথে, আমি পর্যালোচনা করেছি
      গভীর শিক্ষার প্রধান অ্যাপ্লিকেশন এবং এর স্তরযুক্ত, অরৈখিক তুলনা
      ঐতিহ্যগত অ্যালগরিদম সঙ্গে পদ্ধতির.

      ![গভীর শিক্ষার প্রয়োগের ক্ষেত্র এবং তারা যে মডেলগুলি ব্যবহার করে](/images/papers/deep-learning-applications.jpg)

      *ডিপ লার্নিং অ্যাপ্লিকেশান এলাকা এবং মডেলগুলি সাধারণত প্রতিটিতে ব্যবহৃত হয়।
      মোশায়েদী এট আল থেকে চিত্র। (2022), CC বাই 3.0.*

      ## কিভাবে আমরা এলাকাগুলো বেছে নিই

      আমরা এমন ক্ষেত্রগুলির দিকে তাকিয়েছি যেখানে গভীর শিক্ষা স্পষ্টভাবে খেলাটিকে পরিবর্তন করেছে, যেমন

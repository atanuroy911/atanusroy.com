research_intro: >-
  আমার গবেষণা রোবট সম্পর্কে যা দেখতে, বুঝতে এবং কাজ করতে পারে। আজ আমি দৃষ্টি-ভাষা এবং দৃষ্টি-ভাষা-অ্যাকশন মডেল, রোবোটিক
  সিমুলেশন এবং কম্পিউটার ভিশন নিয়ে কাজ করি, AGV নেভিগেশন এবং IoT সিস্টেমে আগের কাজের উপর ভিত্তি করে।

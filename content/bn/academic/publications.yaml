  - title: কৃষি উদ্ভিদ পর্যবেক্ষণের জন্য রাস্পবেরি পাই SCADA জোনাল ভিত্তিক সিস্টেম
    year: 2019
    type: conference
    venue: IEEE ICISCE 2019
    venue_full: 2019 6 তম আন্তর্জাতিক সম্মেলন তথ্য বিজ্ঞান এবং নিয়ন্ত্রণ প্রকৌশল (ICISCE), IEEE
    authors:
      - A. J. Moshayedi
      - A. S. Roy
      - L. Liao
      - S. Li
    tldr: >-
      খামারগুলির জন্য একটি কম খরচে, ওয়েব-ভিত্তিক SCADA সিস্টেম, একটি রাস্পবেরি পাইতে হোস্ট করা হয়েছে এবং স্থানীয় এবং
      দূরবর্তী পর্যবেক্ষণ সহ নিরাপত্তার জন্য জোনে বিভক্ত।
    abstract: >-
      SCADA এবং DCS সিস্টেমগুলি শিল্প অটোমেশনের কেন্দ্রবিন্দু, কিন্তু সফ্টওয়্যার খরচ এবং সীমিত এক্সটেনসিবিলিটি তাদের
      ছোট শিল্পের নাগালের বাইরে রাখে এবং IoT নতুন নিরাপত্তা চ্যালেঞ্জ নিয়ে আসে। এই কাগজটি কৃষির জন্য দুটি ছোট SCADA
      সিস্টেমের নকশা এবং তুলনা করে যা আকারকে হ্রাস করে এবং নিরাপত্তার জন্য একটি জোনাল পদ্ধতি ব্যবহার করে। একটি রাস্পবেরি
      পাই হোস্ট হিসাবে একটি পিসি বা ল্যাপটপকে প্রতিস্থাপন করে, খরচ এবং আকার কমিয়ে দেয়, এমন একটি ডিজাইন যা আগে রিপোর্ট
      করা হয়নি। একটি ওয়েব-ভিত্তিক SCADA সিস্টেম রাস্পবেরি পাই নেটওয়ার্কের মাধ্যমে একটি কৃষি উদ্ভিদ পরিবেশের স্থানীয়
      এবং দূরবর্তী পর্যবেক্ষণ প্রদান করে।

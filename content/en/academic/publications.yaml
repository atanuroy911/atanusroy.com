  - title: An Integrated Beetle Antennae Search–Enabled Navigation Framework for Omnidirectional AGV Mobile Robots in Unknown Environments
    year: 2026
    type: journal
    venue: EAI Trans. AI & Robotics
    venue_full: EAI Endorsed Transactions on AI and Robotics, Vol. 5
    authors: [A. J. Moshayedi, A. S. Roy, U. Karan, M. Zhang, D. Bassir]
    image: /images/papers/omni-agv-design.jpg
    image_alt: The omnidirectional AGV robot platform used in the study
    tldr: >-
      A beetle-inspired optimizer tunes a robot's PID controller while it drives.
      Combined with LiDAR SLAM and A* re-planning, it lets an omnidirectional AGV
      find its way through unknown spaces better than plain PID control.
    abstract: >-
      The Beetle Antennae Search (BAS) algorithm is a recent optimization approach
      inspired by the foraging behaviour of long-horn beetles. Its simple,
      derivative-free structure suits robots with limited computing power, yet most
      BAS navigation studies handle path planning and control separately, or use BAS
      only offline. This research presents an integrated BAS-enabled navigation
      framework, combined with Simultaneous Localization and Mapping (SLAM), for an
      omnidirectional mobile robot in CoppeliaSim. A LiDAR-based occupancy grid is
      updated during motion, a modified A* algorithm creates smoothed collision-free
      paths, and a BAS-driven adaptive PID controller tunes its gains using
      trajectory deviation as feedback. A nine-sensor infrared array handles line
      tracking. Tested with no obstacles and three levels of obstacles, the system
      performed better with SLAM and BAS together than conventional PID-based
      navigation.
    figures:
      - src: /images/papers/omni-agv-design.jpg
        alt: Design views of the omnidirectional AGV with a robot arm
        caption: The omnidirectional AGV platform. Figure from the paper, CC BY.
    doi: 10.4108/airo.11438
    open_access: true
    post: beetle-antennae-agv-2026

  - title: "Path Planning for AGVs: Balancing Computational Efficiency and Optimality"
    year: 2025
    type: conference
    venue: IEEE ICRAIC 2025
    venue_full: 2025 5th International Conference on Robotics, Automation and Intelligent Control (ICRAIC), IEEE
    authors: [A. J. Moshayedi, A. S. Roy, Z. H. Khan, S. Yang, A. Razi, M. E. Andani]
    tldr: >-
      Eleven classical path planners compared on an electric AGV visiting six
      charging stations. Floyd–Warshall gave the lowest cost and energy score; TSP
      and Prim's MST covered the most stations.
    abstract: >-
      Automated Guided Vehicles (AGVs) streamline material handling and logistics in
      industrial automation. This paper evaluates eleven classical pathfinding
      algorithms, including Dijkstra, Depth First Search, Floyd–Warshall, Binary
      Search and Prim's MST, on an Ackermann-steered electric AGV navigating six
      charging stations in a simulated urban environment. Algorithms are grouped
      into By Station and By Edge. Performance is measured by runtime, travel
      distance, cost, speed and station visits, alongside a new Energy Consumption
      Score (ECS) that balances operational efficiency with computational overhead.
      Floyd–Warshall achieved the best overall cost and ECS; TSP and Prim's MST were
      best for station coverage; edge-based algorithms were reliable on predefined
      routes but less efficient overall.
    doi: 10.1109/ICRAIC67376.2025.11375850
    post: icraic-2025-path-planning

  - title: "UrbanPark: Advancing Parking Infrastructure with LoRaWAN-Enabled Smart Parking Modules"
    year: 2025
    type: conference
    venue: IEEE ICCIT 2025
    venue_full: 2025 4th International Conference on Computing and Information Technology (ICCIT), IEEE
    authors: [A. J. Moshayedi, A. S. Roy, Z. H. Khan, S. Yang]
    tldr: >-
      LoRaWAN sensors report free parking spaces in real time to a driver app and an
      admin dashboard, with a Raspberry Pi as the server.
    abstract: >-
      This paper presents UrbanPark, a LoRaWAN-based autonomous smart parking system
      for growing urban parking challenges. It combines a mobile app, a web-based
      admin interface and LoRaWAN-enabled smart parking modules to give drivers and
      administrators real-time parking availability. Drivers can find and reserve
      spaces in the app, while administrators manage the system from the web. The
      modules monitor occupancy on their own and send data over long distances with
      little energy, using a Raspberry Pi as the server. The result is a scalable,
      low-cost and sustainable approach to urban parking management.
    doi: 10.1109/ICCIT63348.2025.10989299
    post: urbanpark-iccit-2025


  tagline: Exploring the frontiers of Computer Vision, Robotics & Embedded Systems
  cta_primary: View Publications
  cta_secondary: Contact Me
bio: >-
  Robots and connected devices increasingly work out in the real world, but the
  models that drive them are often too heavy for the hardware they run on, or too
  brittle when the scene changes. I'm interested in making perception and
  navigation work reliably on small, low-cost devices. My work spans lightweight
  deep learning for on-site inspection, such as finding water-pipe defects on a
  Raspberry Pi, and navigation for automated guided vehicles in unknown and
  crowded spaces, using SLAM, bio-inspired optimisation and timed automata. The
  goal is systems that are cheap enough to deploy widely and dependable enough to
  trust.

  I am a Lecturer in Computer Science & Engineering at the University of Liberal
  Arts Bangladesh (ULAB), where I teach and supervise capstone projects in
  computer vision, IoT and robotics. I am also a member of the Robotics &
  Automation Research Lab (RARL), now based in Leicester, UK. Before ULAB, I
  completed my M.Tech in Computer Science & Engineering at IIT Kanpur
  (2022–2024), working as a Research Assistant at the IoT Vision Lab on deep
  learning for water pipeline inspection under India's Jal Jeevan Mission. I did
  my B.E. in Computer Science & Technology at Jiangxi University of Science &
  Technology in China, where I first joined RARL in 2018.
research_interests:
  - Computer Vision & Object Detection
  - Autonomous Guided Vehicles (AGV)
  - IoT & Embedded Systems
  - Deep Learning on Edge Devices
  - Smart City Infrastructure

  - id: ieee-iotais-2023
    title: IEEE IoT-AIS 2023 — সেরা পেপার মনোনীত
    date: "2023-11-08"
    category: award
    tags:
      - iot
      - computer-vision
      - award
      - ieee
    cover_image: ""
    summary: >-
      স্মার্ট নজরদারির জন্য IoT-ভিত্তিক অসঙ্গতি সনাক্তকরণে আমাদের কাজটি IEEE IoT-AIS 2023-এ সেরা পেপারের জন্য মনোনীত
      হয়েছিল।
    content: |-
      ## ওভারভিউ

      এই প্রকল্পটি স্মার্ট নজরদারির একটি গুরুত্বপূর্ণ ব্যবধানের সমাধান করে: **রিয়েল-টাইম অসঙ্গতি স্থাপন করা
      ক্লাউড আপলিঙ্কের উপর নির্ভর না করে সরাসরি রিসোর্স-সংবদ্ধ প্রান্ত ডিভাইসে সনাক্তকরণ।

      ## সমস্যা

      ঐতিহ্যগত নজরদারি পাইপলাইনগুলি অনুমানের জন্য ক্লাউডে কাঁচা ভিডিও পাঠায় — ব্যয়বহুল,
      উচ্চ-বিলম্বতা, এবং গোপনীয়তা-আক্রমণকারী। আমরা ক্যামেরা নিজেই অনুমান চেয়েছিলাম.

      ## আমাদের দৃষ্টিভঙ্গি

      আমরা TFLite ব্যবহার করে একটি **Raspberry Pi 4** এ একটি কোয়ান্টাইজড **MobileNetV3** (INT8) স্থাপন করেছি।
      একটি লাইটওয়েট মোশন-ট্রিগারড স্যাম্পলিং কৌশলের সাথে মিলিত, সিস্টেমটি অর্জন করে:

      - **~14 fps** ডিভাইসে অনুমান
      - **<80ms** গড় শনাক্তকরণ লেটেন্সি
      - **4W** পাওয়ার খরচের অধীনে

      ## পুরস্কার মনোনয়ন

      আমাদের কাগজটি IEEE আন্তর্জাতিক সম্মেলনে **সেরা পেপার**-এর জন্য মনোনীত হয়েছিল
      IoT-ভিত্তিক অ্যাপ্লিকেশন এবং ইন্টেলিজেন্ট সিস্টেম (IoT-AIS 2023)। এই স্বীকৃতি
      আমাদের প্রান্ত-প্রথম নকশা দর্শনের ব্যবহারিক প্রভাব নিশ্চিত করেছে।

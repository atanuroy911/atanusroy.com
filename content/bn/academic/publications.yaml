      অ্যাপ যা কীটপতঙ্গের প্রাদুর্ভাবের রিয়েল-টাইম পর্যবেক্ষণের জন্য যাতে কৃষকরা তাড়াতাড়ি কাজ করতে পারে, কম কীটনাশক
      ব্যবহার করতে পারে এবং উৎপাদনশীলতা উন্নত করতে পারে। একটি ব্যক্তিগত ইমেজ ক্লাসিফায়ার দিয়ে তৈরি, এটি কৃষকদের
      কীটপতঙ্গ এবং চিকিত্সা ট্র্যাক করতে সাহায্য করার জন্য চার্ট, রিপোর্ট এবং QR কোড যোগ করে। পাঁচটি কীটপতঙ্গের 313টি
      চিত্রের উপর পরীক্ষা করা হয়েছে, এটি গড় নির্ভুলতা এবং 0.75 এর প্রত্যাহার, 1.00 এর নির্ভুলতা এবং 0.856 এর F1 স্কোরে
      পৌঁছেছে। একটি কমলা বাগানে এটি 10টি গাছে সাইট্রাস লিফমাইনার সনাক্ত করে রিপোর্ট করেছে। আলো, ছবির কোণ এবং ডেটার
      গুণমান নির্ভুলতাকে প্রভাবিত করতে পারে এবং বেশ কিছু ছবি তোলা সাহায্য করে।

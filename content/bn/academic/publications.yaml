    image_alt: একটি ড্রোন একটি গাড়িকে রাস্তার চারটি টাইমস্ট্যাম্প পয়েন্ট অতিক্রম করতে দেখছে
    tldr: >-
      একটি রাস্পবেরি পাই এবং মোবাইলনেট-এসএসডি সহ একটি ড্রোন একটি সত্যিকারের সংযোগস্থলে গাড়ির গতি পরিমাপ করে, 0.7 থেকে 3
      মিটার উঁচুতে উড়ে যায়, সাইটে কোনও অফিসার নেই৷
    abstract: >-
      মানবহীন এরিয়াল ভেহিকেল (UAVs) পরিবহনে ব্যাপকভাবে ব্যবহৃত হয়, উদাহরণস্বরূপ IoT-ভিত্তিক স্মার্ট শহরগুলিতে
      রিয়েল-টাইম গাড়ির গতি সনাক্তকরণের জন্য। বেশিরভাগ বিদ্যমান গতি অনুমান পদ্ধতিতে বিভিন্ন পরিস্থিতিতে রিয়েল-টাইম
      সনাক্তকরণের অভাব রয়েছে। এই কাগজ UAVs ব্যবহার করে একটি কম উচ্চতা যানবাহন গতি আবিষ্কারক প্রবর্তন করে। আমরা এর
      উচ্চতা এবং কোণ পরিবর্তন করে ঘরের ভিতরে এবং বাইরে সর্বোত্তম রাস্পবেরি পাই ক্যামেরার ক্ষেত্র খুঁজে পেয়েছি, একটি
      Intel নিউরাল কম্পিউট স্টিক 2 এর সাথে একটি Raspberry Pi 4B-এ একটি MobileNet-SSD গভীর শিক্ষার মডেল এমবেড করেছি এবং
      0.7 এবং 3 মিটারের মধ্যে UAV এর সাথে JXUST বিশ্ববিদ্যালয়ের মোড়ে এটি পরীক্ষা করেছি। ফলাফল হল একটি বুদ্ধিমান
      গতি-নিয়ন্ত্রণ ব্যবস্থা যা পুলিশ উপস্থিত ছাড়াই কাজ করে।

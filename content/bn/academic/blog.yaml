  - id: visapp-2024-paper
    title: VISAPP 2024-এ কাগজ গৃহীত হয়েছে
    date: "2024-02-15"
    category: publication
    tags:
      - computer-vision
      - deep-learning
      - publication
      - conference
    cover_image: ""
    summary: >-
      ডিপ রিইনফোর্সমেন্ট লার্নিং ব্যবহার করে স্বায়ত্তশাসিত গ্রাউন্ড ভেহিকল পাথ প্ল্যানিং সংক্রান্ত আমাদের পেপার VISAPP
      2024-এ গৃহীত হয়েছে — যা লিসবন, পর্তুগালে উপস্থাপন করা হচ্ছে।
    content: |-
      ## পটভূমি

      গতিশীল পরিবেশে অটোনোমাস গ্রাউন্ড ভেহিকেল (AGVs) একটি মৌলিক চ্যালেঞ্জের সম্মুখীন হয়:
      আপনি কীভাবে এমন একটি পথের পরিকল্পনা করবেন যা বাস্তব সময়ে চলমান বাধা, অপ্রত্যাশিত ভূখণ্ডের সাথে খাপ খাইয়ে নেয়,
      এবং অসম্পূর্ণ সেন্সর ডেটা?

      A* এবং Dijkstra-এর অ্যালগরিদমের মতো ধ্রুপদী পদ্ধতিগুলি স্ট্যাটিক মানচিত্রে ভাল কাজ করে কিন্তু সংগ্রাম করে
      যখন পৃথিবী পরিবর্তন হতে থাকে। আমরা জিজ্ঞাসা করেছি: *গভীর শক্তিবৃদ্ধি শিক্ষা কি সেই ব্যবধান বন্ধ করতে পারে?*

      ## আমরা যা তৈরি করেছি

      আমরা প্রক্সিমাল পলিসি অপ্টিমাইজেশান (পিপিও) এর উপরে একটি পুরষ্কার-আকৃতির প্রক্রিয়া তৈরি করেছি
      যা **স্পার্স রিওয়ার্ড** সেটিংসে কনভারজেন্সকে উল্লেখযোগ্যভাবে উন্নত করে। মূল অন্তর্দৃষ্টি
      ঐতিহ্যগত বিরল পুরষ্কার (শুধুমাত্র লক্ষ্যে পৌঁছানোর জন্য পুরস্কার) ধীর, অস্থির প্রশিক্ষণের দিকে পরিচালিত করে।

      আমাদের পদ্ধতি যোগ করে:
      - **প্রগতি পুরষ্কার** - লক্ষ্য থেকে ইউক্লিডীয় দূরত্ব হ্রাসের সমানুপাতিক
      - **সংঘর্ষের শাস্তি** - প্রক্সিমিটি দ্বারা আকৃতি, বাইনারি নয়
      - **অন্বেষণ বোনাস** - স্থানীয় অপটিমা প্রতিরোধ করতে ক্ষয়িষ্ণু কৌতূহল সংকেত

      ## ফলাফল

      | পদ্ধতি | সাফল্যের হার | গড় লক্ষ্যের ধাপ |
      |---|---|---|
      | A* (স্থির মানচিত্র) | 92% | 214 |
      | ভ্যানিলা পিপিও | 61% | 389 |
      | **আমাদের (PPO + আকৃতির)** | **88%** | **241** |

      ফলাফলগুলি দেখায় যে আমাদের দৃষ্টিভঙ্গি ক্লাসিক্যাল প্ল্যানার পারফরম্যান্সের কাছে বাকী থাকা অবস্থায়
      অদেখা গতিশীল বাধার সাথে অভিযোজিত।

      ## সম্মেলন

      আমরা কম্পিউটার ভিশন তত্ত্বের 19তম আন্তর্জাতিক সম্মেলনে এই কাজটি উপস্থাপন করেছি
      এবং অ্যাপ্লিকেশন (**VISAPP 2024**) লিসবন, পর্তুগালে। কাগজটি নীচের লিঙ্কের মাধ্যমে উপলব্ধ।

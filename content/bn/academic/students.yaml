      ইউনিভার্সিটি অফ লিবারেল আর্টস বাংলাদেশ-এ, যোগাযোগের নির্ভরযোগ্যতা এবং দক্ষতা বাড়াতে ESP32-ভিত্তিক বিকেন্দ্রীভূত
      জাল নেটওয়ার্কের উপর গবেষণা পরিচালনা করছে। তার কাজ বুদ্ধিমান রাউটিং অ্যালগরিদম, স্বয়ংক্রিয় নোড ব্যর্থতা
      সনাক্তকরণ, ব্যান্ডউইথ অপ্টিমাইজেশান, এবং জরুরী বার্তা অগ্রাধিকারের উপর ফোকাস করে যাতে একটি কেন্দ্রীয় সার্ভার
      ছাড়াই দ্রুত এবং নিরবচ্ছিন্ন যোগাযোগ নিশ্চিত করা যায়। তিনি এমবেডেড সিস্টেম, কম্পিউটার নেটওয়ার্কিং এবং
      বাস্তব-বিশ্বের প্রযুক্তিগত চ্যালেঞ্জের উদ্ভাবনী সমাধানের বিষয়ে উত্সাহী।
